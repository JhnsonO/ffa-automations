name: OEV — one-shot sample02 stride1 control

on:
  push:
    branches:
      - experiment/sample02-v4-stride1-control

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'launch-sample02-stride1-control'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sample02 180s stride1 control
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload=$(cat <<JSON
          {
            "ref": "${REF}",
            "inputs": {
              "datacenter": "EU-RO-1",
              "sample_id": "sample_02",
              "duration_s": "180",
              "sample_set_id": "GX010197-seed1384188843",
              "model_variant": "yolo26m",
              "lookahead": "1.5",
              "cluster_alpha_override": "0.08"
            }
          }
          JSON
          )
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/oev-runpod-sample-baseline.yml/dispatches" \
            -d "$payload")
          cat /tmp/body.txt || true
          test "$code" = '204'
          echo 'Dispatched sample02 v4 stride1 cadence control.'
