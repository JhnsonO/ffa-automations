name: OEV Test Runtime v1 — Isolated RunPod Benchmark (image-backed)

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Full GHCR image ref to benchmark (immutable tag) -- now the small runtime-lite image; heavy assets come from vars.OEV_NETWORK_VOLUME_MAP instead of image layers'
        required: false
        default: 'ghcr.io/jhnsono/oev-test-runtime:v1-lite'
        type: string
      datacenter_id:
        description: 'Datacenter id whose volume to benchmark against (key in vars.OEV_NETWORK_VOLUME_MAP). Leave blank to auto-select the best-available candidate from the map.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  benchmark-runtime-v1:
    name: Benchmark OEV Test Runtime v1 (RunPod)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record job start
        id: t0
        run: echo "job_start=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"

      - name: Generate SSH key pair
        run: |
          pip install -q cryptography
          python3 -u - << 'PY'
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          import os

          key = Ed25519PrivateKey.generate()
          priv = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.OpenSSH,
              serialization.NoEncryption(),
          )
          pub = key.public_key().public_bytes(
              serialization.Encoding.OpenSSH,
              serialization.PublicFormat.OpenSSH,
          )
          with open('/tmp/runpod_key', 'wb') as f:
              f.write(priv)
          with open('/tmp/runpod_key.pub', 'wb') as f:
              f.write(pub + b' ffa-oev-test-runtime-benchmark\n')
          os.chmod('/tmp/runpod_key', 0o600)
          PY

      - name: Select datacenter candidates from OEV_NETWORK_VOLUME_MAP
        id: volume
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          VOLUME_MAP: ${{ vars.OEV_NETWORK_VOLUME_MAP }}
          DATACENTER_ID: ${{ inputs.datacenter_id }}
        run: |
          python3 -u - << 'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          volume_map_json = os.environ.get('VOLUME_MAP', '')
          dc_input = os.environ.get('DATACENTER_ID', '').strip()
          if not volume_map_json:
              print('::error::vars.OEV_NETWORK_VOLUME_MAP is not set. Run oev-network-volume-setup.yml (and oev-populate-volume.yml) first.')
              raise SystemExit(1)
          volume_map = json.loads(volume_map_json)
          if not volume_map:
              print('::error::vars.OEV_NETWORK_VOLUME_MAP is set but empty.')
              raise SystemExit(1)

          if dc_input:
              # Explicit datacenter_id means "only this one, no fallback" --
              # the person deliberately pinned it, so silently trying
              # others would be surprising.
              volume_id = volume_map.get(dc_input)
              if not volume_id:
                  print(f'::error::datacenter_id={dc_input!r} is not a key in OEV_NETWORK_VOLUME_MAP={volume_map_json}. Valid keys: {list(volume_map.keys())}')
                  raise SystemExit(1)
              candidates_out = [{'dc': dc_input, 'volume_id': volume_id}]
              print(f'Using explicit datacenter_id={dc_input}, volume={volume_id} (no cross-DC fallback)')
          else:
              # Auto-select mode: score ALL map datacenters across all 8
              # allowed GPU types (not just RTX 4090) and pass the whole
              # ranked list through -- the launch step tries them in
              # round-robin order, falling through to the next candidate
              # if one is out of capacity, instead of failing the whole
              # run over one DC's bad luck. Availability is a ranking
              # hint only: every map datacenter stays a candidate even
              # at score 0.
              GPU_WEIGHTS = {
                  'NVIDIA GeForce RTX 4090': 8,
                  'NVIDIA RTX A5000': 7,
                  'NVIDIA GeForce RTX 3090': 6,
                  'NVIDIA L4': 5,
                  'NVIDIA L40S': 4,
                  'NVIDIA GeForce RTX 5090': 3,
                  'NVIDIA RTX 2000 Ada Generation': 2,
                  'NVIDIA RTX PRO 6000 Blackwell Server Edition': 1,
              }
              AVAILABILITY_POINTS = {'HIGH': 3, 'MEDIUM': 2, 'LOW': 1}

              headers = {
                  'Authorization': f'Bearer {os.environ["RUNPOD_API_KEY"]}',
                  'Accept': 'application/json',
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) ffa-automations-oev-test-runtime-benchmark',
              }
              scores = {dc: 0 for dc in volume_map}
              api_ok = False
              try:
                  req = urllib.request.Request(
                      'https://api.runpod.io/v2/catalog/gpus?include=AVAILABILITY&product=POD',
                      headers=headers,
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      gpu_types = json.loads(response.read())
                  if isinstance(gpu_types, dict):
                      gpu_types = gpu_types.get('gpus') or gpu_types.get('data') or []
                  for g in gpu_types:
                      gpu_name = g.get('id') or g.get('name')
                      weight = GPU_WEIGHTS.get(gpu_name)
                      if weight is None:
                          continue
                      for entry in (g.get('dataCenters') or []):
                          dc_id = entry.get('id')
                          if dc_id not in scores:
                              continue
                          points = AVAILABILITY_POINTS.get(entry.get('availability', ''), 0)
                          scores[dc_id] += weight * points
                  api_ok = True
              except Exception as exc:
                  print(f'GPU-type/datacenter availability query failed or unexpected shape: {exc}')

              for dc_id, score in scores.items():
                  print(f'Datacenter {dc_id}: score={score}')

              if api_ok:
                  # Higher score first; every map DC is a candidate
                  # regardless of score (availability is a hint, not a
                  # filter). Python sort is stable, so ties keep the
                  # original map order.
                  ranked_dcs = sorted(volume_map.keys(), key=lambda dc: -scores.get(dc, 0))
              else:
                  print('Availability API failed -- falling back to stable map order.')
                  ranked_dcs = list(volume_map.keys())

              candidates_out = [{'dc': dc, 'volume_id': volume_map[dc]} for dc in ranked_dcs]
              print(f'Ranked {len(candidates_out)} candidate datacenter(s) for round-robin fallback: {ranked_dcs}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'candidates={json.dumps(candidates_out)}\n')
              f.write(f'explicit={"true" if dc_input else "false"}\n')
          PY

      # Launch step: round-robin across candidate datacenters with two
      # GPU tiers and a round-based download-speed floor. Pod-allocation
      # mechanics (create/wait_for_network/wait_for_ssh/preflight/delete)
      # are unchanged from the prior per-DC-retry version; only the outer
      # control flow (which DC/GPU-tier/threshold to try, and when a DC
      # is removed vs merely demoted) has changed. imageName still points
      # at the OEV Test Runtime v1 image; hardware preflight
      # (runpod_gpu_preflight.sh) is unmodified and still required to pass.
      - name: Launch RunPod GPU pod (round-robin cross-DC, tiered GPUs)
        id: launch
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          IMAGE_REF: ${{ inputs.image_ref }}
          CANDIDATES: ${{ steps.volume.outputs.candidates }}
          EXPLICIT: ${{ steps.volume.outputs.explicit }}
        run: |
          python3 -u - << 'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ['RUNPOD_API_KEY']
          image_ref = os.environ['IMAGE_REF']
          candidates = json.loads(os.environ['CANDIDATES'])
          is_pinned = os.environ.get('EXPLICIT', 'false') == 'true'
          if not candidates:
              print('::error::No datacenter candidates resolved from OEV_NETWORK_VOLUME_MAP.')
              sys.exit(1)
          base = 'https://rest.runpod.io/v1'
          headers = {
              'Authorization': f'Bearer {api_key}',
              'Content-Type': 'application/json',
              'Accept': 'application/json',
          }
          pub_key = open('/tmp/runpod_key.pub').read().strip()

          # Global round schedule (replaces the old per-DC attempt budget).
          # Round 1 sweeps the top-ranked DCs fast (no sleep before it).
          # Rounds 2-3 widen to the full eligible DC set with a real sleep
          # first, since RunPod capacity fluctuates minute to minute.
          ROUNDS = 3
          SLEEP_BEFORE_ROUND = [0, 30, 60]
          MIN_DOWNLOAD_MBPS_BY_ROUND = [800, 400, None]
          POD_IDS_FILE = '/tmp/runpod_all_pod_ids.txt'
          open(POD_IDS_FILE, 'w').close()

          def request(method, url, data=None, timeout=30):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  err_body = exc.read().decode(errors='replace')[:500]
                  raise RuntimeError(f'HTTP {exc.code} from {method} {url}: {err_body}') from exc

          def delete_pod(pod_id):
              try:
                  request('DELETE', f'{base}/pods/{pod_id}', timeout=20)
                  print(f'Deleted pod {pod_id} (attempt cleanup).')
              except Exception as exc:
                  print(f'Delete warning for pod {pod_id}: {exc} (final cleanup step will retry).')

          # Two GPU tiers: round 1 offers only the 4 most common/cheapest
          # types; rounds 2-3 widen to all 8 (unchanged full list) so
          # expensive fallback GPUs only enter once the normal ones have
          # failed across all eligible datacenters.
          GPU_TIER_ROUND1 = [
              'NVIDIA GeForce RTX 4090',
              'NVIDIA RTX A5000',
              'NVIDIA GeForce RTX 3090',
              'NVIDIA L4',
          ]
          GPU_TIER_WIDE = [
              'NVIDIA GeForce RTX 4090',
              'NVIDIA RTX A5000',
              'NVIDIA GeForce RTX 3090',
              'NVIDIA L4',
              'NVIDIA L40S',
              'NVIDIA GeForce RTX 5090',
              'NVIDIA RTX 2000 Ada Generation',
              'NVIDIA RTX PRO 6000 Blackwell Server Edition',
          ]

          def create_pod(volume_id, min_download_mbps, gpu_type_ids):
              create_body = {
                  'name': 'oev-test-runtime-benchmark',
                  'imageName': image_ref,
                  'gpuTypeIds': gpu_type_ids,
                  'gpuTypePriority': 'custom',
                  'gpuCount': 1,
                  'cloudType': 'SECURE',
                  'containerDiskInGb': 40,
                  'networkVolumeId': volume_id,
                  'volumeMountPath': '/runpod-volume',
                  'ports': ['22/tcp'],
                  'supportPublicIp': True,
                  'allowedCudaVersions': ['12.8'],
                  'env': {
                      'PUBLIC_KEY': pub_key,
                      'SSH_PUBLIC_KEY': pub_key,
                  },
              }
              if min_download_mbps is not None:
                  create_body['minDownloadMbps'] = min_download_mbps
              printable = {k: v for k, v in create_body.items() if k != 'env'}
              print(f'Creating pod: {json.dumps(printable)}')
              pod = request('POST', f'{base}/pods', create_body)
              pod_id = pod.get('id')
              if not pod_id:
                  raise RuntimeError(f'pod create response had no id: {pod}')
              with open(POD_IDS_FILE, 'a') as f:
                  f.write(pod_id + '\n')
              print(f'Pod created: id={pod_id}')
              return pod_id

          def wait_for_network(pod_id, timeout_s=1200):
              deadline = time.time() + timeout_s
              info = {}
              while time.time() < deadline:
                  info = request('GET', f'{base}/pods/{pod_id}?includeMachine=true')
                  public_ip = info.get('publicIp')
                  mappings = info.get('portMappings') or {}
                  mapped_22 = None
                  if isinstance(mappings, dict):
                      mapped_22 = mappings.get('22') or mappings.get('22/tcp')
                  if public_ip and mapped_22:
                      return public_ip, mapped_22, info
                  time.sleep(10)
              raise RuntimeError(f'pod {pod_id} never reported a public IP + SSH mapping within {timeout_s}s')

          def wait_for_ssh(ip, port, attempts=18, delay_s=5):
              for i in range(1, attempts + 1):
                  result = subprocess.run(
                      ['ssh', '-o', 'StrictHostKeyChecking=no', '-o', 'ConnectTimeout=8',
                       '-i', '/tmp/runpod_key', '-p', str(port), f'root@{ip}', 'echo OK'],
                      capture_output=True, text=True, timeout=15,
                  )
                  if 'OK' in result.stdout:
                      return True
                  print(f'SSH not ready ({i}/{attempts})')
                  time.sleep(delay_s)
              return False

          def run_preflight(ip, port):
              ssh_opts = ['-i', '/tmp/runpod_key', '-p', str(port), '-o', 'StrictHostKeyChecking=no',
                          '-o', 'ConnectTimeout=15', '-o', 'ServerAliveInterval=30',
                          '-o', 'ServerAliveCountMax=10', '-o', 'TCPKeepAlive=yes']
              scp_opts = ['-i', '/tmp/runpod_key', '-P', str(port), '-o', 'StrictHostKeyChecking=no',
                          '-o', 'ServerAliveInterval=30', '-o', 'ServerAliveCountMax=10',
                          '-o', 'TCPKeepAlive=yes']
              subprocess.run(['scp'] + scp_opts + ['runpod_gpu_preflight.sh', f'root@{ip}:/tmp/runpod_gpu_preflight.sh'],
                              check=True, timeout=60)
              subprocess.run(['ssh'] + ssh_opts + [f'root@{ip}', 'chmod +x /tmp/runpod_gpu_preflight.sh'],
                              check=True, timeout=30)
              result = subprocess.run(
                  ['ssh'] + ssh_opts + [f'root@{ip}', 'stdbuf -oL -eL /tmp/runpod_gpu_preflight.sh'],
                  capture_output=True, text=True, timeout=180,
              )
              output = result.stdout + result.stderr
              passed = result.returncode == 0 and 'PREFLIGHT_RESULT=PASS' in output.splitlines()
              return passed, output

          # DC bookkeeping across rounds:
          #   order        -- mutable ranked list; network-timeout demotes
          #                    a DC to the back of this for FUTURE rounds
          #                    only (current round keeps going as-is).
          #   removed_dcs  -- DCs dropped entirely after preflight/SSH
          #                    failure (bad-host avoidance). Never applies
          #                    in pinned mode: a pinned DC has nowhere
          #                    else to go, so it stays eligible and is
          #                    simply retried next round instead.
          order = [c['dc'] for c in candidates]
          dc_volume = {c['dc']: c['volume_id'] for c in candidates}
          removed_dcs = set()

          winner = None
          summary_lines = []

          for round_num in range(1, ROUNDS + 1):
              sleep_s = SLEEP_BEFORE_ROUND[round_num - 1]
              if sleep_s:
                  print(f'\nWaiting {sleep_s}s before round {round_num} (real gap, not a blind retry)...')
                  time.sleep(sleep_s)

              # Round 1 = every currently-eligible mapped DC, in ranked
              # order -- not capped to a fixed count, so this scales
              # correctly if a 5th+ DC is added to the map later. Only
              # the GPU tier and download-speed floor differ by round;
              # the DC set itself is the same full eligible set in every
              # round (minus anything removed for bad-host reasons).
              round_dcs = [dc for dc in order if dc not in removed_dcs]
              gpu_type_ids = GPU_TIER_ROUND1 if round_num == 1 else GPU_TIER_WIDE
              min_dl = MIN_DOWNLOAD_MBPS_BY_ROUND[round_num - 1]

              if not round_dcs:
                  print(f'=== Round {round_num}: no eligible datacenters remain, skipping ===')
                  continue

              print(f'\n=== Round {round_num}/{ROUNDS}: DCs={round_dcs} gpu_tier={"preferred-4" if round_num == 1 else "all-8"} minDownloadMbps={min_dl} ===')

              for dc in round_dcs:
                  volume_id = dc_volume[dc]
                  print(f'--- Round {round_num}: trying {dc} (volume {volume_id}) ---')
                  pod_requested_at = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
                  try:
                      pod_id = create_pod(volume_id, min_dl, gpu_type_ids)
                  except Exception as exc:
                      # Capacity failure (or any create-time error): keep
                      # DC eligible, move on immediately, no sleep.
                      print(f'::error::round {round_num} {dc}: pod create failed (min_dl={min_dl}): {exc}')
                      summary_lines.append(f'round={round_num} dc={dc} pod_id=none min_download_mbps={min_dl} result=CREATE_FAILED error={exc}')
                      continue

                  try:
                      ip, port, info = wait_for_network(pod_id)
                  except Exception as exc:
                      # Network timeout: delete pod, keep DC eligible, but
                      # demote it to the back of the order for FUTURE
                      # rounds only -- this round just continues normally.
                      print(f'round {round_num} {dc}: {exc}')
                      summary_lines.append(f'round={round_num} dc={dc} pod_id={pod_id} result=NETWORK_TIMEOUT')
                      delete_pod(pod_id)
                      if dc in order:
                          order.remove(dc)
                          order.append(dc)
                      continue

                  machine = info.get('machine') or {}
                  gpu_obj = info.get('gpu') or {}
                  gpu_type = (
                      gpu_obj.get('displayName')
                      or (machine.get('gpuType') or {}).get('displayName')
                      or machine.get('gpuDisplayName')
                      or machine.get('gpuTypeId')
                      or 'unknown'
                  )
                  machine_id = info.get('machineId') or 'unknown'
                  data_center_id = machine.get('dataCenterId') or dc
                  cost_per_hr = info.get('costPerHr')
                  cost_str = f'{cost_per_hr}' if cost_per_hr is not None else 'unavailable'
                  network_ready_at = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())

                  if not wait_for_ssh(ip, port):
                      # SSH timeout: bad-host signal. Delete pod, remove
                      # DC from further rounds -- except pinned mode,
                      # which has no other DC to fall back to and instead
                      # just retries the same DC next round.
                      print(f'round {round_num} {dc}: SSH never came up on pod {pod_id} ({ip}:{port})')
                      summary_lines.append(
                          f'round={round_num} dc={dc} pod_id={pod_id} host_ip={ip} machine_id={machine_id} '
                          f'data_center_id={data_center_id} gpu={gpu_type} result=SSH_TIMEOUT'
                      )
                      delete_pod(pod_id)
                      if not is_pinned:
                          removed_dcs.add(dc)
                          print(f'Removed {dc} from further rounds (SSH timeout -- known-bad-host avoidance).')
                      continue

                  try:
                      passed, preflight_output = run_preflight(ip, port)
                  except Exception as exc:
                      print(f'round {round_num} {dc}: preflight upload/run failed: {exc}')
                      summary_lines.append(
                          f'round={round_num} dc={dc} pod_id={pod_id} host_ip={ip} machine_id={machine_id} '
                          f'data_center_id={data_center_id} gpu={gpu_type} result=PREFLIGHT_ERROR error={exc}'
                      )
                      delete_pod(pod_id)
                      if not is_pinned:
                          removed_dcs.add(dc)
                          print(f'Removed {dc} from further rounds (preflight error -- known-bad-host avoidance).')
                      continue

                  with open(f'preflight_attempt_{dc}_round{round_num}.txt', 'w') as f:
                      f.write(preflight_output)

                  result_str = 'PASS' if passed else 'FAIL'
                  summary_lines.append(
                      f'round={round_num} dc={dc} pod_id={pod_id} host_ip={ip} machine_id={machine_id} '
                      f'data_center_id={data_center_id} gpu={gpu_type} cost_per_hr={cost_str} result={result_str}'
                  )

                  if passed:
                      with open('preflight_output.txt', 'w') as f:
                          f.write(preflight_output)
                      ssh_ready_at = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
                      winner = {
                          'pod_id': pod_id, 'ip': ip, 'port': port, 'gpu_type': gpu_type,
                          'cost_per_hr': cost_str, 'machine_id': machine_id,
                          'data_center_id': data_center_id,
                          'pod_requested_at': pod_requested_at,
                          'network_ready_at': network_ready_at,
                          'ssh_ready_at': ssh_ready_at,
                      }
                      break
                  else:
                      # Preflight FAIL (ran, but hardware didn't pass):
                      # same bad-host removal rule as SSH timeout.
                      print(f'round {round_num} {dc}: NVDEC preflight FAILED on pod {pod_id} (host {ip}) -- deleting.')
                      delete_pod(pod_id)
                      if not is_pinned:
                          removed_dcs.add(dc)
                          print(f'Removed {dc} from further rounds (preflight FAIL -- known-bad-host avoidance).')

              if winner is not None:
                  break
              print(f'=== Round {round_num} exhausted, no healthy pod yet ===')

          with open('pod_selection_summary.txt', 'w') as f:
              f.write('\n'.join(summary_lines) + '\n')

          if winner is None:
              print(f'::error::All {ROUNDS} rounds exhausted with no healthy pod. Removed (bad-host) DCs: {sorted(removed_dcs)}. See pod_selection_summary.txt.')
              sys.exit(1)

          launch_time = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          print(f'Selected healthy pod: {winner}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'pod_id={winner["pod_id"]}\n')
              output.write(f'ip={winner["ip"]}\n')
              output.write(f'port={winner["port"]}\n')
              output.write(f'gpu_type={winner["gpu_type"]}\n')
              output.write(f'cost_per_hr={winner["cost_per_hr"]}\n')
              output.write(f'launch_time={launch_time}\n')
              output.write(f'pod_requested_at={winner["pod_requested_at"]}\n')
              output.write(f'network_ready_at={winner["network_ready_at"]}\n')
              output.write(f'ssh_ready_at={winner["ssh_ready_at"]}\n')
          PY


      - name: Volume acceptance checks (manifest, models, reco version -- no build/export)
        id: image_check
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          echo "image_check_start=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes root@$IP"
          $SSH "nvidia-smi -L"
          $SSH "test -f /runpod-volume/oev-runtime/manifest.json || { echo 'FATAL: manifest.json not found on mounted volume -- was oev-populate-volume.yml run for this volume?'; exit 1; }"
          $SSH "cat /runpod-volume/oev-runtime/manifest.json"
          $SSH "cd /runpod-volume/oev-runtime/models && sha256sum -c models.sha256"
          $SSH "/runpod-volume/oev-runtime/bin/reco --version"
          $SSH "python3 -c 'import onnxruntime; print(onnxruntime.get_available_providers())'"
          echo "image_check_end=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"

      - name: Resolve benchmark pack file IDs (OEV Drive Benchmarks/oev-test-runtime-v1/)
        id: resolve
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: |
          echo "$YOUTUBE_TOKEN" > /tmp/youtube_token.json
          echo "$YOUTUBE_CREDENTIALS" > /tmp/youtube_credentials.json
          python3 -u - << 'PY'
          import json
          import urllib.parse
          import urllib.request as req

          OEV_DRIVE_FOLDER_ID = '18Y8hI_S29BMeg5FEoxlaqoGy1DsQ7GKJ'
          token_data = json.loads(open('/tmp/youtube_token.json').read())
          creds_data = json.loads(open('/tmp/youtube_credentials.json').read())
          payload = json.dumps({
              'client_id': token_data.get('client_id') or creds_data['installed']['client_id'],
              'client_secret': token_data.get('client_secret') or creds_data['installed']['client_secret'],
              'refresh_token': token_data['refresh_token'],
              'grant_type': 'refresh_token',
          }).encode()
          response = req.urlopen(req.Request(
              'https://oauth2.googleapis.com/token', data=payload,
              headers={'Content-Type': 'application/json'}, method='POST',
          ))
          token = json.loads(response.read())
          access_token = token['access_token']
          open('/tmp/drive_token.txt', 'w').write(access_token)

          def find_id(name, parent):
              q = f"name='{name}' and '{parent}' in parents and trashed=false"
              url = 'https://www.googleapis.com/drive/v3/files?' + urllib.parse.urlencode({
                  'q': q, 'fields': 'files(id,name)',
                  'supportsAllDrives': 'true', 'includeItemsFromAllDrives': 'true',
              })
              r = req.urlopen(req.Request(url, headers={'Authorization': f'Bearer {access_token}'}))
              files = json.loads(r.read()).get('files', [])
              if not files:
                  raise RuntimeError(f'{name} not found under parent {parent}')
              return files[0]['id']

          benchmarks_id = find_id('Benchmarks', OEV_DRIVE_FOLDER_ID)
          pack_id = find_id('oev-test-runtime-v1', benchmarks_id)
          left_id = find_id('left_2274_19s.mp4', pack_id)
          right_id = find_id('right_2274_19s.mp4', pack_id)
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'left_id={left_id}\nright_id={right_id}\n')
          PY

      - name: Download benchmark pack to pod
        id: download
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
          LEFT_ID: ${{ steps.resolve.outputs.left_id }}
          RIGHT_ID: ${{ steps.resolve.outputs.right_id }}
        run: |
          echo "download_start=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
          ACCESS_TOKEN=$(cat /tmp/drive_token.txt)
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes root@$IP"
          $SSH "mkdir -p /tmp/oev_run"
          $SSH "set -o pipefail; aria2c -x 8 -s 8 --file-allocation=none --header='Authorization: Bearer $ACCESS_TOKEN' --dir=/tmp/oev_run --out=left.mp4 'https://www.googleapis.com/drive/v3/files/$LEFT_ID?alt=media' 2>&1 | tail -5"
          $SSH "set -o pipefail; aria2c -x 8 -s 8 --file-allocation=none --header='Authorization: Bearer $ACCESS_TOKEN' --dir=/tmp/oev_run --out=right.mp4 'https://www.googleapis.com/drive/v3/files/$RIGHT_ID?alt=media' 2>&1 | tail -5"
          $SSH "test -s /tmp/oev_run/left.mp4 && test -s /tmp/oev_run/right.mp4 && ls -lh /tmp/oev_run/left.mp4 /tmp/oev_run/right.mp4"
          echo "download_end=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"

      - name: Upload + run benchmark script
        id: run_benchmark
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes root@$IP"
          SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          $SCP oev_test_runtime_benchmark_remote.sh root@$IP:/tmp/oev_run/
          $SSH "chmod +x /tmp/oev_run/oev_test_runtime_benchmark_remote.sh"

          processing_start=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          echo "processing_start=$processing_start" >> "$GITHUB_OUTPUT"
          remote_rc=0
          $SSH "unset DISPLAY; stdbuf -oL -eL /tmp/oev_run/oev_test_runtime_benchmark_remote.sh" || remote_rc=$?
          processing_end=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          echo "processing_end=$processing_end" >> "$GITHUB_OUTPUT"
          echo "remote_exit=$remote_rc" >> "$GITHUB_OUTPUT"
          echo "Remote benchmark script exit: $remote_rc"

      - name: Pull back logs + outputs + timing
        if: always()
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          mkdir -p benchmark_artifacts
          cp preflight_output.txt pod_selection_summary.txt preflight_attempt_*.txt benchmark_artifacts/ 2>/dev/null || true
          if [ -n "$IP" ] && [ -n "$PORT" ]; then
            SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
            for file in timing.log calibrate.log stitch.log acceptance.log match.json events.jsonl followcam.mp4; do
              $SCP "root@$IP:/tmp/oev_run/$file" benchmark_artifacts/ || echo "$file missing"
            done
          fi

      - name: Build timing.json breakdown
        if: always()
        env:
          JOB_START: ${{ steps.t0.outputs.job_start }}
          POD_REQUESTED_AT: ${{ steps.launch.outputs.pod_requested_at }}
          NETWORK_READY_AT: ${{ steps.launch.outputs.network_ready_at }}
          SSH_READY_AT: ${{ steps.launch.outputs.ssh_ready_at }}
          IMAGE_CHECK_START: ${{ steps.image_check.outputs.image_check_start }}
          IMAGE_CHECK_END: ${{ steps.image_check.outputs.image_check_end }}
          DOWNLOAD_START: ${{ steps.download.outputs.download_start }}
          DOWNLOAD_END: ${{ steps.download.outputs.download_end }}
          PROCESSING_START: ${{ steps.run_benchmark.outputs.processing_start }}
          PROCESSING_END: ${{ steps.run_benchmark.outputs.processing_end }}
          GPU_TYPE: ${{ steps.launch.outputs.gpu_type }}
          COST_PER_HR: ${{ steps.launch.outputs.cost_per_hr }}
        run: |
          python3 - << 'PY'
          import json, os
          from datetime import datetime

          def parse(s):
              if not s:
                  return None
              for fmt in ('%Y-%m-%dT%H:%M:%S.%fZ', '%Y-%m-%dT%H:%M:%SZ'):
                  try:
                      return datetime.strptime(s, fmt)
                  except ValueError:
                      continue
              return None

          def delta(a, b):
              ta, tb = parse(a), parse(b)
              if ta is None or tb is None:
                  return None
              return (tb - ta).total_seconds()

          env = os.environ
          breakdown = {
              'job_start_to_pod_requested_s': delta(env.get('JOB_START'), env.get('POD_REQUESTED_AT')),
              'pod_requested_to_network_ready_s': delta(env.get('POD_REQUESTED_AT'), env.get('NETWORK_READY_AT')),
              'network_ready_to_ssh_preflight_pass_s': delta(env.get('NETWORK_READY_AT'), env.get('SSH_READY_AT')),
              'image_acceptance_check_s': delta(env.get('IMAGE_CHECK_START'), env.get('IMAGE_CHECK_END')),
              'benchmark_pack_download_s': delta(env.get('DOWNLOAD_START'), env.get('DOWNLOAD_END')),
              'render_total_wrapper_s': delta(env.get('PROCESSING_START'), env.get('PROCESSING_END')),
              'model_export_s': 0,
              'reco_build_s': 0,
              'gpu_type': env.get('GPU_TYPE'),
              'cost_per_hr': env.get('COST_PER_HR'),
          }

          # Fine-grained calibrate/render split from the remote script's own
          # timing.log, if it was pulled back successfully.
          try:
              lines = open('benchmark_artifacts/timing.log').read().splitlines()
              marks = {}
              for line in lines:
                  if '=' in line:
                      k, v = line.split('=', 1)
                      marks[k.strip()] = v.strip()
              breakdown['env_sanity_s'] = delta(marks.get('timing_env_sanity_start'), marks.get('timing_env_sanity_end'))
              breakdown['calibrate_s'] = delta(marks.get('timing_calibrate_start'), marks.get('timing_calibrate_end'))
              breakdown['render_s'] = delta(marks.get('timing_render_start'), marks.get('timing_render_end'))
          except FileNotFoundError:
              breakdown['note'] = 'remote timing.log not retrieved -- see benchmark_artifacts for whatever was pulled back'

          if breakdown.get('job_start_to_pod_requested_s') is not None and breakdown.get('render_total_wrapper_s') is not None:
              parts = [v for v in [
                  breakdown.get('job_start_to_pod_requested_s'),
                  breakdown.get('pod_requested_to_network_ready_s'),
                  breakdown.get('network_ready_to_ssh_preflight_pass_s'),
                  breakdown.get('image_acceptance_check_s'),
                  breakdown.get('benchmark_pack_download_s'),
                  breakdown.get('render_total_wrapper_s'),
              ] if v is not None]
              breakdown['total_wall_clock_s'] = sum(parts)

          os.makedirs('benchmark_artifacts', exist_ok=True)
          with open('benchmark_artifacts/timing.json', 'w') as f:
              json.dump(breakdown, f, indent=2)
          print(json.dumps(breakdown, indent=2))
          PY

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oev-test-runtime-benchmark-${{ github.run_id }}
          path: benchmark_artifacts/
          retention-days: 30

      # Terminate step: copied verbatim (mechanics unchanged) from
      # .github/workflows/oev-runpod-followcam.yml's "Terminate RunPod
      # pod(s)" step. No changes.
      - name: Terminate RunPod pod(s)
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID: ${{ steps.launch.outputs.pod_id }}
        run: |
          python3 -u - << 'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          pod_ids = []
          try:
              with open('/tmp/runpod_all_pod_ids.txt') as f:
                  pod_ids = [line.strip() for line in f if line.strip()]
          except FileNotFoundError:
              pass

          single = os.environ.get('POD_ID', '').strip()
          if single and single not in pod_ids:
              pod_ids.append(single)

          pod_ids = list(dict.fromkeys(pod_ids))

          if not pod_ids:
              print('No pod IDs recorded -- nothing to terminate.')
              raise SystemExit(0)

          headers = {'Authorization': f"Bearer {os.environ['RUNPOD_API_KEY']}"}
          failures = []

          for pod_id in pod_ids:
              url = f'https://rest.runpod.io/v1/pods/{pod_id}'
              last_error = None
              confirmed = False
              for attempt in range(1, 4):
                  req = urllib.request.Request(url, method='DELETE', headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          status = response.status
                          if status in (200, 202, 204):
                              print(f'Pod {pod_id} termination confirmed (HTTP {status}) on attempt {attempt}.')
                              confirmed = True
                              break
                          last_error = f'unexpected HTTP {status}'
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          print(f'Pod {pod_id} already absent (HTTP 404) -- cleanup confirmed.')
                          confirmed = True
                          break
                      body = exc.read().decode(errors='replace')[:300]
                      last_error = f'HTTP {exc.code}: {body}'
                  except Exception as exc:
                      last_error = repr(exc)

                  print(f'Pod {pod_id}: DELETE attempt {attempt}/3 failed: {last_error}')
                  if attempt < 3:
                      time.sleep(5)

              if not confirmed:
                  failures.append((pod_id, last_error))

          if failures:
              for pod_id, last_error in failures:
                  print(f'::error::Pod {pod_id} termination NOT confirmed after 3 attempts: {last_error}')
              raise SystemExit(1)

          print(f'All {len(pod_ids)} pod(s) created this run confirmed terminated.')
          PY

      - name: Evaluate acceptance
        if: always()
        env:
          REMOTE_EXIT: ${{ steps.run_benchmark.outputs.remote_exit }}
        run: |
          echo "Remote script exit code: ${REMOTE_EXIT:-unknown}"
          if [ "${REMOTE_EXIT:-1}" != '0' ]; then
            echo "::error::OEV Test Runtime v1 benchmark did NOT pass (remote exit ${REMOTE_EXIT:-unknown}). See artifact logs."
            exit 1
          fi
          echo "OEV Test Runtime v1 benchmark PASSED acceptance (image-backed, CPU-detector, YOLO26m@1920)."
