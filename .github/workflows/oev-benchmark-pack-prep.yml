name: OEV Test Runtime v1 — Benchmark Pack Prep (one-time, no GPU)

on:
  workflow_dispatch:
    inputs:
      left_clip:
        description: 'Full source left clip filename in OEV Drive root'
        required: false
        default: 'GX010197.MP4'
        type: string
      right_clip:
        description: 'Full source right clip filename in OEV Drive root'
        required: false
        default: 'GX010173.MP4'
        type: string
      seg_start:
        description: 'Segment start (s) -- pinned to the successful YOLO26m A/B run, do not change casually'
        required: false
        default: '2274'
        type: string
      seg_duration:
        description: 'Segment duration (s) -- pinned to the successful YOLO26m A/B run'
        required: false
        default: '19'
        type: string

permissions:
  contents: read

jobs:
  prepare-benchmark-pack:
    name: Extract + verify + upload benchmark pack
    # ffmpeg stream-copy trim only -- no decode/re-encode, no GPU needed.
    # This is why this is its own workflow: it should run once (or
    # whenever the pinned segment changes), not on every experiment.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve full-source clip IDs in OEV Drive root folder
        id: resolve
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          LEFT_CLIP: ${{ inputs.left_clip }}
          RIGHT_CLIP: ${{ inputs.right_clip }}
        run: |
          echo "$YOUTUBE_TOKEN" > /tmp/youtube_token.json
          echo "$YOUTUBE_CREDENTIALS" > /tmp/youtube_credentials.json
          python3 -u - << 'PY'
          import json
          import os
          import urllib.parse
          import urllib.request as req

          OEV_DRIVE_FOLDER_ID = '18Y8hI_S29BMeg5FEoxlaqoGy1DsQ7GKJ'
          token_data = json.loads(open('/tmp/youtube_token.json').read())
          creds_data = json.loads(open('/tmp/youtube_credentials.json').read())
          payload = json.dumps({
              'client_id': token_data.get('client_id') or creds_data['installed']['client_id'],
              'client_secret': token_data.get('client_secret') or creds_data['installed']['client_secret'],
              'refresh_token': token_data['refresh_token'],
              'grant_type': 'refresh_token',
          }).encode()
          response = req.urlopen(req.Request(
              'https://oauth2.googleapis.com/token',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          ))
          token = json.loads(response.read())
          if 'access_token' not in token:
              raise RuntimeError(f'Token refresh failed: {token}')
          access_token = token['access_token']
          open('/tmp/drive_token.txt', 'w').write(access_token)

          def find_in_drive_root(filename):
              q = f"name='{filename}' and '{OEV_DRIVE_FOLDER_ID}' in parents and trashed=false"
              url = 'https://www.googleapis.com/drive/v3/files?' + urllib.parse.urlencode({
                  'q': q,
                  'fields': 'files(id,name)',
                  'supportsAllDrives': 'true',
                  'includeItemsFromAllDrives': 'true',
              })
              response = req.urlopen(req.Request(
                  url,
                  headers={'Authorization': f'Bearer {access_token}'},
              ))
              files = json.loads(response.read()).get('files', [])
              if not files:
                  raise RuntimeError(f'{filename} not found in OEV Drive root folder')
              return files[0]['id']

          left_id = find_in_drive_root(os.environ['LEFT_CLIP'])
          right_id = find_in_drive_root(os.environ['RIGHT_CLIP'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'left_id={left_id}\nright_id={right_id}\n')
          PY

      - name: Download full source clips
        env:
          LEFT_ID: ${{ steps.resolve.outputs.left_id }}
          RIGHT_ID: ${{ steps.resolve.outputs.right_id }}
        run: |
          ACCESS_TOKEN=$(cat /tmp/drive_token.txt)
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends aria2
          mkdir -p /tmp/oev_pack
          aria2c -x 8 -s 8 --file-allocation=none --header="Authorization: Bearer $ACCESS_TOKEN" \
            --dir=/tmp/oev_pack --out=left_full.mp4 "https://www.googleapis.com/drive/v3/files/$LEFT_ID?alt=media"
          aria2c -x 8 -s 8 --file-allocation=none --header="Authorization: Bearer $ACCESS_TOKEN" \
            --dir=/tmp/oev_pack --out=right_full.mp4 "https://www.googleapis.com/drive/v3/files/$RIGHT_ID?alt=media"
          test -s /tmp/oev_pack/left_full.mp4 && test -s /tmp/oev_pack/right_full.mp4
          ls -lh /tmp/oev_pack/

      - name: Extract pinned segment (exact command form from production script)
        id: extract
        env:
          SEG_START: ${{ inputs.seg_start }}
          SEG_DURATION: ${{ inputs.seg_duration }}
        run: |
          cd /tmp/oev_pack
          # Identical command graph to runpod_followcam_remote.sh's segment
          # trim (-ss before -i, -c copy) -- same seek/keyframe-snap
          # behaviour, same source files, so the effective input is the
          # same content the successful YOLO26m A/B run (31608010277)
          # actually processed, not an independently-derived cut.
          ffmpeg -y -ss "$SEG_START" -i left_full.mp4 -t "$SEG_DURATION" -c copy left.mp4 2>&1 | tee extract.log
          ffmpeg -y -ss "$SEG_START" -i right_full.mp4 -t "$SEG_DURATION" -c copy right.mp4 2>&1 | tee -a extract.log
          test -s left.mp4 && test -s right.mp4

          {
            echo "left_duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 left.mp4)"
            echo "right_duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 right.mp4)"
            echo "left_size_bytes=$(stat -c%s left.mp4)"
            echo "right_size_bytes=$(stat -c%s right.mp4)"
          } | tee equivalence_check.txt

      - name: Verify equivalence against the successful A/B run signature
        run: |
          cd /tmp/oev_pack
          # Reference values captured from run 31608010277's segment.log
          # (the actual successful YOLO26m A/B dispatch): right.mp4 output
          # ~143554kB muxed, duration ~18.99s at -ss 2274 -t 19 -c copy
          # against the same GX010197.MP4/GX010173.MP4 sources. This step
          # fails loudly rather than silently accepting a different cut.
          right_dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 right.mp4)
          right_size=$(stat -c%s right.mp4)
          python3 - << PY
          dur = float("$right_dur")
          size = $right_size
          # Reference: duration ~18.99s (ffmpeg time=00:00:18.99), size ~143554000 bytes.
          # Allow small tolerance for muxer/container overhead variance across ffmpeg builds.
          assert 18.5 <= dur <= 19.5, f"right.mp4 duration {dur}s outside expected ~18.99s window -- NOT equivalent to run 31608010277's segment"
          assert 140_000_000 <= size <= 147_000_000, f"right.mp4 size {size}B outside expected ~143554000B window -- NOT equivalent to run 31608010277's segment"
          print(f"Equivalence check PASSED: duration={dur}s size={size}B (reference: ~18.99s / ~143554000B)")
          PY

      - name: Upload benchmark pack + verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oev-benchmark-pack-${{ github.run_id }}
          path: |
            /tmp/oev_pack/left.mp4
            /tmp/oev_pack/right.mp4
            /tmp/oev_pack/extract.log
            /tmp/oev_pack/equivalence_check.txt
          retention-days: 30

      - name: Upload benchmark pack to OEV Drive Benchmarks/oev-test-runtime-v1/ folder
        id: drive_upload
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: |
          pip install -q google-auth google-auth-oauthlib google-api-python-client
          python3 -u - << 'PY'
          import json, os, sys
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          OEV_DRIVE_FOLDER_ID = '18Y8hI_S29BMeg5FEoxlaqoGy1DsQ7GKJ'
          token_data = json.loads(open('/tmp/youtube_token.json').read())
          creds_data = json.loads(open('/tmp/youtube_credentials.json').read())
          creds = Credentials(
              token=None,
              refresh_token=token_data['refresh_token'],
              token_uri=token_data.get('token_uri', 'https://oauth2.googleapis.com/token'),
              client_id=token_data.get('client_id') or creds_data['installed']['client_id'],
              client_secret=token_data.get('client_secret') or creds_data['installed']['client_secret'],
          )
          drive = build('drive', 'v3', credentials=creds)

          def find_or_create_folder(name, parent):
              res = drive.files().list(
                  q=f"name='{name}' and '{parent}' in parents and trashed=false and mimeType='application/vnd.google-apps.folder'",
                  fields='files(id)', supportsAllDrives=True, includeItemsFromAllDrives=True,
              ).execute()
              files = res.get('files', [])
              if files:
                  return files[0]['id']
              folder = drive.files().create(
                  body={'name': name, 'mimeType': 'application/vnd.google-apps.folder', 'parents': [parent]},
                  fields='id',
              ).execute()
              return folder['id']

          benchmarks_id = find_or_create_folder('Benchmarks', OEV_DRIVE_FOLDER_ID)
          pack_id = find_or_create_folder('oev-test-runtime-v1', benchmarks_id)

          for local_name, drive_name in [('left.mp4', 'left_2274_19s.mp4'), ('right.mp4', 'right_2274_19s.mp4')]:
              path = f'/tmp/oev_pack/{local_name}'
              local_size = os.path.getsize(path)
              media = MediaFileUpload(path, mimetype='video/mp4', resumable=True)
              uploaded = drive.files().create(
                  body={'name': drive_name, 'parents': [pack_id]},
                  media_body=media, fields='id', supportsAllDrives=True,
              ).execute()
              file_id = uploaded['id']
              verify = drive.files().get(fileId=file_id, fields='id,size', supportsAllDrives=True).execute()
              remote_size = int(verify.get('size', -1))
              if remote_size != local_size:
                  print(f'::error::Upload verification failed for {drive_name}: local {local_size} != remote {remote_size}')
                  sys.exit(1)
              print(f'Uploaded {drive_name} -> Drive file id {file_id} (verified {remote_size}B)')
          PY
