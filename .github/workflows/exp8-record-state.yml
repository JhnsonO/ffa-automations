name: EXP8 record verified state

on:
  push:
    branches:
      - diag/zc-exp8-image-alloc-size
    paths:
      - '.github/workflows/exp8-record-state.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Prepend verified EXP8 result
        env:
          EXP8_ENTRY_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('docs/ai-project-state.md')
          s = p.read_text()
          entry = base64.b64decode(os.environ['EXP8_ENTRY_B64']).decode()
          marker = '## OEV zero-copy NV12 corruption — EXP8 allocation-size A/B FALSIFIED; stop-loss reached'
          if marker not in s:
              p.write_text(entry + s)
          PY
          git diff --check

      - name: Commit verified state to main
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/ai-project-state.md; then
            echo 'No state change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai-project-state.md
          git commit -m 'docs: record EXP8 allocation-size falsification'
          git push origin HEAD:main
