name: OEV Test Runtime v1 — Build + Publish (GHCR)

on:
  workflow_dispatch:
    inputs:
      reco_sha:
        description: 'Pinned video-stitcher (Reco) commit SHA to build into the image'
        required: false
        default: '53fe10f548d5767ad94ef66aeaedf2d8c7161f27'
        type: string
      image_tag:
        description: 'Immutable image tag (never latest)'
        required: false
        default: 'v1-reco-53fe10f5'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build + publish OEV Test Runtime image
    # Deliberately a standard (non-GPU) runner. Building this image does
    # not require a physical GPU: ort-sys pulls a prebuilt ONNX Runtime
    # binary, cuDNN is a runtime dlopen dependency not a link-time one,
    # and nvcc compiles the CUDA preprocessing kernels against a
    # compute-capability list rather than a live device. If this build
    # fails with concrete evidence of a GPU-device requirement (not
    # just a missing lib), that failure is captured below and is the
    # signal to move image compilation onto GPU-backed compute --
    # not an assumption made in advance.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.tags.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/oev-test-runtime"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_LOWER:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Build and push (immutable tag, no latest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.image_ref }}
          build-args: |
            RECO_SHA=${{ inputs.reco_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record digest
        run: |
          echo "Published: ${{ steps.tags.outputs.image_ref }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

      - name: Install crane and gitleaks (pinned, checksum-verified)
        env:
          CRANE_VERSION: "0.21.7"
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          cd /tmp

          curl -sSLO "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          curl -sSLO "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf go-containerregistry_Linux_x86_64.tar.gz crane
          sudo mv crane /usr/local/bin/crane

          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

          crane version
          gitleaks version

      - name: Gitleaks canary self-test
        run: |
          set +e
          echo 'aws_access_key_id = AKIAIOSFODNN7EXAMPLE' | gitleaks stdin --no-banner --exit-code 2
          CANARY_EXIT=$?
          set -e
          if [ "$CANARY_EXIT" -ne 2 ]; then
            echo "::error::Gitleaks canary self-test failed -- known fake AWS key was NOT detected (exit $CANARY_EXIT, expected 2). This gitleaks build may be silently broken; refusing to trust the layer scan."
            exit 1
          fi
          echo "Gitleaks canary self-test passed -- known fake secret correctly detected."

      - name: No-secrets-in-layers check
        env:
          IMAGE_REF: ${{ steps.tags.outputs.image_ref }}
        run: |
          set -euo pipefail
          crane manifest --platform linux/amd64 "$IMAGE_REF" \
            | jq -r '.layers[] | "\(.digest) \(.mediaType)"' \
          | while read -r digest mediatype; do
            echo "Scanning layer $digest ($mediatype)"
            case "$mediatype" in
              *tar+gzip*)
                crane blob "$IMAGE_REF@$digest" | gunzip -c | tar -xO 2>/dev/null \
                  | gitleaks stdin --no-banner --exit-code 2
                ;;
              *tar+zstd*)
                crane blob "$IMAGE_REF@$digest" | zstd -dc | tar -xO 2>/dev/null \
                  | gitleaks stdin --no-banner --exit-code 2
                ;;
              *tar)
                crane blob "$IMAGE_REF@$digest" | tar -xO 2>/dev/null \
                  | gitleaks stdin --no-banner --exit-code 2
                ;;
              *)
                echo "Unrecognized layer mediaType: $mediatype" >&2
                exit 1
                ;;
            esac
          done

      - name: Smoke-check manifest inside image (no GPU required)
        env:
          IMAGE_REF: ${{ steps.tags.outputs.image_ref }}
        run: |
          docker run --rm "$IMAGE_REF" cat /opt/oev-runtime/manifest.json
          docker run --rm "$IMAGE_REF" sha256sum -c /opt/oev-runtime/models/models.sha256
          docker run --rm "$IMAGE_REF" /opt/oev-runtime/bin/reco --version
