name: Validate public project directory

on:
  pull_request:
    paths:
      - 'site/data/projects.json'
      - 'site/scripts/validate-projects.mjs'
      - '.github/workflows/validate-project-directory.yml'
  push:
    paths:
      - 'site/data/projects.json'
      - 'site/scripts/validate-projects.mjs'
      - '.github/workflows/validate-project-directory.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-projects.mjs
