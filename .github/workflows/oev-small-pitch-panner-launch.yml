name: OEV — Launch Small-Pitch Panner Test

on:
  push:
    branches:
      - experiment/small-pitch-panner-01-launcher
    paths:
      - .github/workflows/oev-small-pitch-panner-launch.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch standard sample workflow against test branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = 'https://api.github.com/repos/JhnsonO/ffa-automations/actions/workflows/oev-runpod-sample-baseline.yml/dispatches'
          payload = {
              'ref': 'experiment/small-pitch-panner-01',
              'inputs': {
                  'datacenter': 'EU-RO-1',
                  'sample_id': 'sample_01',
                  'duration_s': '30',
                  'sample_set_id': 'GX010197-seed1384188843',
                  'model_variant': 'yolo26m',
                  'lookahead': '1.5',
                  'cluster_alpha_override': '0.08',
              },
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              print(f'dispatch_status={response.status}')
          print(json.dumps(payload, indent=2))
          PY
