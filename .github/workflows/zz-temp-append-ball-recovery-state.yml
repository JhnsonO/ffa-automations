name: One-shot append OEV ball recovery state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-temp-append-ball-recovery-state.yml'

permissions:
  contents: write

jobs:
  append-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify known-good state file and append handoff
        shell: bash
        run: |
          set -euo pipefail
          expected_blob='ccaafe35cc68e6b426524ce991331f5d02fa210d'
          actual_blob="$(git hash-object docs/ai-project-state.md)"
          if [[ "$actual_blob" != "$expected_blob" ]]; then
            echo "Refusing to append: expected state blob $expected_blob, got $actual_blob" >&2
            exit 1
          fi
          printf '%s' '' | base64 -d >> docs/ai-project-state.md
          read -r adds dels file < <(git diff --numstat -- docs/ai-project-state.md)
          if [[ "$dels" != "0" ]]; then
            echo "Refusing to commit: append unexpectedly deleted $dels lines" >&2
            exit 1
          fi
          echo "State append verified: +$adds / -$dels"

      - name: Commit append and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-temp-append-ball-recovery-state.yml
          git add docs/ai-project-state.md
          git commit -m 'docs: record ball recovery diagnosis and reacquisition plan'
          git push origin HEAD:main
