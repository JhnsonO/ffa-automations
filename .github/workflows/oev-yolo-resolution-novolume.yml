name: OEV — YOLO Resolution A/B (no-volume RunPod)

on:
  push:
    branches:
      - experiment/yolo-highres-01
    paths:
      - 'oev/yolo_resolution_run.json'

permissions:
  contents: read

jobs:
  followcam:
    name: YOLO resolution sample_02 180s
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v5

      - name: Install orchestration dependencies
        run: pip install -q cryptography google-auth google-api-python-client

      - name: Validate experiment scripts
        run: |
          python3 -m py_compile scripts/oev_yolo_resolution_novolume.py
          bash -n runpod_yolo_resolution_local_remote.sh

      - name: Run controlled resolution arm
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: python3 -u scripts/oev_yolo_resolution_novolume.py

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yolo-resolution-arm-${{ github.run_id }}
          path: followcam_artifacts/
          retention-days: 30
          if-no-files-found: warn
