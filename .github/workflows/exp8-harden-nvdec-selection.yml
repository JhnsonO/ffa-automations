name: EXP8 hard-gate NVDEC during pod selection

on:
  push:
    branches:
      - diag/zc-exp8-image-alloc-size
    paths:
      - '.github/workflows/exp8-harden-nvdec-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/zc-exp8-image-alloc-size
          fetch-depth: 1

      - name: Apply guarded harness patch
        run: python3 scripts/exp8_patch_nvdec_gate.py

      - name: Verify scope and commit
        run: |
          set -euo pipefail
          git diff --check
          git diff -- .github/workflows/oev-zero-copy-diag.yml
          grep -q 'Candidate accepted by hard preflight' .github/workflows/oev-zero-copy-diag.yml
          grep -q 'PREFLIGHT_NVDEC=PASS' .github/workflows/oev-zero-copy-diag.yml
          grep -q 'failed_gpu_models' .github/workflows/oev-zero-copy-diag.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/oev-zero-copy-diag.yml
          git commit -m 'EXP8 harness: reject broken NVDEC hosts before build'
          git push origin HEAD:diag/zc-exp8-image-alloc-size
