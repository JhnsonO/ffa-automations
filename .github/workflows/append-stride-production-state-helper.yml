name: Append production stride state helper

on:
  push:
    branches: [feature/frame-stride-testing]
    paths:
      - .github/workflows/append-stride-production-state-helper.yml
      - tools/append_stride_production_state.py

permissions:
  contents: write

jobs:
  append:
    if: ${{ !contains(github.event.head_commit.message, '[stride-prod-state]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/frame-stride-testing
      - name: Append verified state
        run: |
          python3 tools/append_stride_production_state.py
          grep -q 'OEV production full-rate frame stride — VERIFIED 2026-08-15' docs/ai-project-state.md
          git diff --check
      - name: Commit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai-project-state.md
          git commit -m 'docs: record production stride 3 verification [stride-prod-state]'
          git push origin HEAD:feature/frame-stride-testing
