name: One-shot dispatch — OEV RunPod follow-cam

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_dispatch-oev-runpod-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch RunPod follow-cam workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/oev-runpod-followcam.yml/dispatches" \
            -d '{"ref":"main","inputs":{"left_clip":"GX010197.MP4","right_clip":"GX010173.MP4"}}'
