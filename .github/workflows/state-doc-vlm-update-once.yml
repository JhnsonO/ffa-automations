name: OEV State Doc VLM Update Once

on:
  push:
    branches:
      - state/update-vlm-fallback-20260817
    paths:
      - .github/workflows/state-doc-vlm-update-once.yml

permissions:
  contents: write

jobs:
  update-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply state update
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 <(curl -fsSL https://raw.githubusercontent.com/JhnsonO/ffa-automations/state/update-vlm-fallback-20260817/experiments/update_state_vlm_20260817.py)
          git diff --check
          git diff -- docs/ai-project-state.md

      - name: Commit state update to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-project-state.md
          git commit -m "docs: update OEV ball recovery and VLM state"
          git push origin HEAD:main
