name: OEV Optical-Flow Ball Bridge L4 Once

on:
  push:
    branches:
      - experiment/optical-flow-ball-bridge-01
    paths:
      - .github/workflows/oev-optflow-l4-once.yml

permissions:
  contents: read

jobs:
  optflow-l4:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v5

      - name: Generate ephemeral SSH key
        run: |
          pip install -q cryptography
          python3 - <<'PY'
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          import os
          key = Ed25519PrivateKey.generate()
          open('/tmp/runpod_key','wb').write(key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.OpenSSH,
              serialization.NoEncryption()))
          pub = key.public_key().public_bytes(
              serialization.Encoding.OpenSSH,
              serialization.PublicFormat.OpenSSH)
          open('/tmp/runpod_key.pub','wb').write(pub + b' oev-optflow-l4\n')
          os.chmod('/tmp/runpod_key', 0o600)
          PY

      - name: Allocate healthy EU-RO-1 L4
        id: launch
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          VOLUME_MAP_JSON: ${{ vars.OEV_NETWORK_VOLUME_MAP }}
        run: |
          python3 -u - <<'PY'
          import json, os, subprocess, time, urllib.request, urllib.error
          api_key=os.environ['RUNPOD_API_KEY']
          volume_map=json.loads(os.environ['VOLUME_MAP_JSON'])
          dc='EU-RO-1'
          volume_id=volume_map[dc]
          base='https://rest.runpod.io/v1'
          headers={'Authorization':f'Bearer {api_key}','Content-Type':'application/json','Accept':'application/json'}
          pub=open('/tmp/runpod_key.pub').read().strip()
          all_ids=[]

          def request(method,url,data=None,timeout=30):
              body=json.dumps(data).encode() if data is not None else None
              req=urllib.request.Request(url,data=body,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode(errors='replace')[:500]
                  raise RuntimeError(f'HTTP {exc.code}: {body}') from exc

          def delete(pid):
              try:
                  request('DELETE',f'{base}/pods/{pid}',timeout=20)
                  print(f'deleted failed pod {pid}')
              except Exception as exc:
                  print(f'delete warning {pid}: {exc}')

          def wait_network(pid, timeout=300):
              deadline=time.time()+timeout
              while time.time()<deadline:
                  info=request('GET',f'{base}/pods/{pid}?includeMachine=true')
                  ip=info.get('publicIp'); mappings=info.get('portMappings') or {}
                  port=mappings.get('22') or mappings.get('22/tcp') if isinstance(mappings,dict) else None
                  if ip and port: return ip,port,info
                  time.sleep(8)
              raise RuntimeError('network timeout')

          ssh_common=['-i','/tmp/runpod_key','-o','StrictHostKeyChecking=no','-o','ConnectTimeout=12','-o','ServerAliveInterval=30','-o','ServerAliveCountMax=10']
          winner=None
          for attempt in range(1,7):
              if attempt>1:
                  time.sleep(15)
              print(f'--- L4 allocation attempt {attempt}/6 ---')
              body={
                  'name':'oev-optflow-l4',
                  'imageName':'runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404',
                  'gpuTypeIds':['NVIDIA L4'],
                  'gpuTypePriority':'custom','gpuCount':1,'cloudType':'SECURE',
                  'containerDiskInGb':120,'ports':['22/tcp'],'supportPublicIp':True,
                  'allowedCudaVersions':['12.8'],'networkVolumeId':volume_id,
                  'volumeMountPath':'/runpod-volume','dataCenterIds':[dc],
                  'env':{'PUBLIC_KEY':pub,'SSH_PUBLIC_KEY':pub},
              }
              try:
                  pod=request('POST',f'{base}/pods',body)
              except Exception as exc:
                  print(f'create failed: {exc}')
                  continue
              pid=pod.get('id')
              if not pid:
                  print(f'no pod id: {pod}'); continue
              all_ids.append(pid)
              open('/tmp/optflow_l4_all_pods.txt','a').write(pid+'\n')
              try:
                  ip,port,info=wait_network(pid)
                  ok=False
                  for _ in range(18):
                      r=subprocess.run(['ssh']+ssh_common+['-p',str(port),f'root@{ip}','echo OK'],capture_output=True,text=True,timeout=15)
                      if 'OK' in r.stdout:
                          ok=True; break
                      time.sleep(5)
                  if not ok:
                      raise RuntimeError('ssh timeout')
                  scp=['scp','-i','/tmp/runpod_key','-P',str(port),'-o','StrictHostKeyChecking=no']
                  subprocess.run(scp+['runpod_gpu_preflight.sh',f'root@{ip}:/tmp/runpod_gpu_preflight.sh'],check=True,timeout=60)
                  result=subprocess.run(['ssh']+ssh_common+['-p',str(port),f'root@{ip}','chmod +x /tmp/runpod_gpu_preflight.sh && stdbuf -oL -eL /tmp/runpod_gpu_preflight.sh'],capture_output=True,text=True,timeout=180)
                  print(result.stdout); print(result.stderr)
                  if result.returncode!=0 or 'PREFLIGHT_RESULT=PASS' not in result.stdout.splitlines():
                      raise RuntimeError('NVDEC/CUDA/Vulkan/ORT preflight failed')
                  machine=(info.get('machine') or {})
                  gpu=(info.get('gpu') or {}).get('displayName') or (machine.get('gpuType') or {}).get('displayName') or 'NVIDIA L4'
                  winner=(pid,ip,port,gpu,info.get('machineId') or 'unknown',machine.get('dataCenterId') or dc,info.get('costPerHr'))
                  break
              except Exception as exc:
                  print(f'pod {pid} rejected: {exc}')
                  delete(pid)
          if winner is None:
              raise SystemExit('no healthy L4 available after 6 attempts')
          pid,ip,port,gpu,machine,dc_actual,cost=winner
          print(f'Selected healthy pod: id={pid} gpu={gpu} machine={machine} dc={dc_actual} cost={cost}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'pod_id={pid}\nip={ip}\nport={port}\ngpu={gpu}\nmachine_id={machine}\ndatacenter={dc_actual}\ncost_per_hr={cost}\n')
          PY

      - name: Bootstrap validated Reco CUDA runtime
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no"
          $SCP runpod_bootstrap.sh root@$IP:/tmp/runpod_bootstrap.sh
          $SSH root@$IP "chmod +x /tmp/runpod_bootstrap.sh && stdbuf -oL -eL /tmp/runpod_bootstrap.sh" | tee bootstrap_output.txt
          actual=$($SSH root@$IP "sed -n 's/^video-stitcher_sha=//p' /tmp/runpod_bootstrap_versions.log | tail -1")
          test "$actual" = "c8b0d74b537d192c7de8d2856de64620a82830cf"

      - name: Stage sample_02 180s pair from Drive
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: |
          echo "$YOUTUBE_TOKEN" > /tmp/youtube_token.json
          echo "$YOUTUBE_CREDENTIALS" > /tmp/youtube_credentials.json
          python3 - <<'PY'
          import json, urllib.request, os
          t=json.load(open('/tmp/youtube_token.json')); c=json.load(open('/tmp/youtube_credentials.json'))
          payload=json.dumps({
              'client_id':t.get('client_id') or c['installed']['client_id'],
              'client_secret':t.get('client_secret') or c['installed']['client_secret'],
              'refresh_token':t['refresh_token'],'grant_type':'refresh_token'}).encode()
          r=urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=payload,headers={'Content-Type':'application/json'},method='POST'))
          token=json.loads(r.read())['access_token']
          open('/tmp/drive_token.txt','w').write(token)
          PY
          ACCESS_TOKEN=$(cat /tmp/drive_token.txt)
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          $SSH root@$IP "apt-get update -qq && apt-get install -y -qq --no-install-recommends aria2 >/dev/null && mkdir -p /tmp/oev_run"
          $SSH root@$IP "aria2c -q -x 8 -s 8 --file-allocation=none --header='Authorization: Bearer $ACCESS_TOKEN' --dir=/tmp/oev_run --out=left.mp4 'https://www.googleapis.com/drive/v3/files/1dWRcKX3TUF-WdNiWMbIT_p_1dI-EfbDq?alt=media'"
          $SSH root@$IP "aria2c -q -x 8 -s 8 --file-allocation=none --header='Authorization: Bearer $ACCESS_TOKEN' --dir=/tmp/oev_run --out=right.mp4 'https://www.googleapis.com/drive/v3/files/1pgspDYygvAbmL4aP6fLYKcQysMnw4S-N?alt=media'"
          $SSH root@$IP "test -s /tmp/oev_run/left.mp4 && test -s /tmp/oev_run/right.mp4 && test -s /runpod-volume/oev-runtime/models/yolo26m.onnx && ls -lh /tmp/oev_run/left.mp4 /tmp/oev_run/right.mp4 /runpod-volume/oev-runtime/models/yolo26m.onnx"

      - name: Run targeted optical-flow A/B
        id: experiment
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no"
          $SCP runpod_sample_baseline_yolo26_remote.sh root@$IP:/tmp/oev_run/runpod_sample_baseline_yolo26_remote.sh
          $SSH root@$IP "chmod +x /tmp/oev_run/runpod_sample_baseline_yolo26_remote.sh"
          set +e
          $SSH root@$IP "export LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:\${LD_LIBRARY_PATH:-}; export VK_DRIVER_FILES=/tmp/nvidia_egl_icd.json; export VK_ICD_FILENAMES=/tmp/nvidia_egl_icd.json; unset DISPLAY; SAMPLE_ID=sample_02 DURATION_S=180 LEFT_CLIP=sample_02_left_180s.mp4 RIGHT_CLIP=sample_02_right_180s.mp4 YOLO26_VARIANT=yolo26m LOOKAHEAD=1.5 CLUSTER_ALPHA_OVERRIDE=0.08 stdbuf -oL -eL /tmp/oev_run/runpod_sample_baseline_yolo26_remote.sh" | tee remote_output.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "remote_exit=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Pull experiment artifacts
        if: always() && steps.launch.outputs.ip != ''
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          mkdir -p optflow_artifacts
          cp bootstrap_output.txt remote_output.txt optflow_artifacts/ 2>/dev/null || true
          SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15"
          for f in segment.log calibrate.log stitch.log acceptance.log match.json events.jsonl followcam.mp4 control_stitch.log experiment_stitch.log flow_bridge.log flow_report.json metrics.json control_events.jsonl experiment_events.jsonl flow_bridge.jsonl patch.log; do
            $SCP root@$IP:/tmp/oev_run/$f optflow_artifacts/ || true
          done

      - name: Upload GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oev-optical-flow-ball-bridge-l4-${{ github.run_id }}
          path: optflow_artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Terminate every RunPod pod from this job
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, time
          try: ids=[x.strip() for x in open('/tmp/optflow_l4_all_pods.txt') if x.strip()]
          except FileNotFoundError: ids=[]
          headers={'Authorization':f"Bearer {os.environ['RUNPOD_API_KEY']}"}
          for pid in dict.fromkeys(ids):
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(f'https://rest.runpod.io/v1/pods/{pid}',method='DELETE',headers=headers)
                      urllib.request.urlopen(req,timeout=20).read()
                      print(f'terminated {pid}'); break
                  except urllib.error.HTTPError as exc:
                      if exc.code==404:
                          print(f'{pid} already absent'); break
                      if attempt==2: raise
                  except Exception:
                      if attempt==2: raise
                  time.sleep(4)
          PY

      - name: Validate execution
        if: always()
        env:
          REMOTE_EXIT: ${{ steps.experiment.outputs.remote_exit }}
        run: |
          echo "remote_exit=${REMOTE_EXIT:-missing}"
          test "${REMOTE_EXIT:-1}" = "0"
          test -s optflow_artifacts/acceptance.log
          test -s optflow_artifacts/events.jsonl
          test -s optflow_artifacts/followcam.mp4
