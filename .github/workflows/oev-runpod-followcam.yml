name: OEV — Follow-Cam Test (Reco field autocam, RunPod)

on:
  workflow_dispatch:
    inputs:
      left_clip:
        description: 'Exact filename of the FULL original source clip in the OEV Drive root folder (left/first camera) -- NOT the Trimmed/ subfolder'
        required: false
        default: 'GX010197.MP4'
        type: string
      right_clip:
        description: 'Exact filename of the FULL original source clip in the OEV Drive root folder (right/second camera) -- NOT the Trimmed/ subfolder'
        required: false
        default: 'GX010173.MP4'
        type: string

permissions:
  contents: read

jobs:
  followcam-test-runpod:
    name: Follow-Cam Test (RunPod)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate SSH key pair
        run: |
          pip install -q cryptography
          python3 -u - << 'PY'
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          import os

          key = Ed25519PrivateKey.generate()
          priv = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.OpenSSH,
              serialization.NoEncryption(),
          )
          pub = key.public_key().public_bytes(
              serialization.Encoding.OpenSSH,
              serialization.PublicFormat.OpenSSH,
          )
          with open('/tmp/runpod_key', 'wb') as f:
              f.write(priv)
          with open('/tmp/runpod_key.pub', 'wb') as f:
              f.write(pub + b' ffa-oev-runpod-followcam\n')
          os.chmod('/tmp/runpod_key', 0o600)
          PY

      - name: Launch RunPod GPU pod
        id: launch
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 -u - << 'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ['RUNPOD_API_KEY']
          base = 'https://rest.runpod.io/v1'
          headers = {
              'Authorization': f'Bearer {api_key}',
              'Content-Type': 'application/json',
              'Accept': 'application/json',
          }
          pub_key = open('/tmp/runpod_key.pub').read().strip()

          def request(method, url, data=None, timeout=30):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  err_body = exc.read().decode(errors='replace')[:500]
                  raise RuntimeError(
                      f'HTTP {exc.code} from {method} {url}: {err_body}'
                  ) from exc

          def best_effort_delete(pod_id):
              try:
                  request('DELETE', f'{base}/pods/{pod_id}', timeout=20)
                  print(f'Best-effort cleanup: pod {pod_id} deleted')
              except Exception as exc:
                  # Final if:always() cleanup gets another chance because pod_id
                  # is written to GITHUB_OUTPUT immediately after creation.
                  print(f'Best-effort cleanup warning for pod {pod_id}: {exc}')

          create_body = {
              'name': 'oev-runpod-followcam',
              'imageName': 'runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404',
              'gpuTypeIds': [
                  'NVIDIA GeForce RTX 4090',
                  'NVIDIA RTX A5000',
                  'NVIDIA GeForce RTX 3090',
                  'NVIDIA L4',
              ],
              'gpuTypePriority': 'custom',
              'gpuCount': 1,
              'cloudType': 'SECURE',
              'containerDiskInGb': 120,
              'ports': ['22/tcp'],
              'supportPublicIp': True,
              'allowedCudaVersions': ['12.8'],
              # RunPod documentation/templates use both names in different
              # SSH-key paths. Supplying both is harmless and makes this
              # ephemeral per-run key explicit for the stock image.
              'env': {
                  'PUBLIC_KEY': pub_key,
                  'SSH_PUBLIC_KEY': pub_key,
              },
          }
          printable = {k: v for k, v in create_body.items() if k != 'env'}
          print(f'Creating pod: {json.dumps(printable)}')
          pod = request('POST', f'{base}/pods', create_body)
          pod_id = pod.get('id')
          if not pod_id:
              print(f'ERROR: pod create response had no id: {pod}', file=sys.stderr)
              sys.exit(1)

          print(f'Pod created: id={pod_id}')
          launch_time = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          # Persist the ID BEFORE any polling/network work. If anything below
          # fails, the unconditional cleanup step still knows what to delete.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'pod_id={pod_id}\n')
              output.write(f'launch_time={launch_time}\n')

          try:
              ip = None
              port = None
              deadline = time.time() + 300
              while time.time() < deadline:
                  info = request('GET', f'{base}/pods/{pod_id}')
                  public_ip = info.get('publicIp')
                  mappings = info.get('portMappings') or {}
                  mapped_22 = None
                  if isinstance(mappings, dict):
                      mapped_22 = mappings.get('22') or mappings.get('22/tcp')
                  if public_ip and mapped_22:
                      ip = public_ip
                      port = mapped_22
                      break
                  time.sleep(10)

              if not ip or not port:
                  raise RuntimeError(
                      f'pod {pod_id} never reported a public IP + SSH mapping within 5 minutes'
                  )

              machine = info.get('machine') or {}
              gpu_obj = info.get('gpu') or {}
              gpu_type_obj = machine.get('gpuType') or {}
              gpu_type = (
                  gpu_obj.get('displayName')
                  or gpu_type_obj.get('displayName')
                  or machine.get('gpuDisplayName')
                  or machine.get('gpuTypeId')
                  or 'unknown'
              )
              cost_per_hr = info.get('costPerHr')
              cost_str = f'{cost_per_hr}' if cost_per_hr is not None else 'unavailable'

              print(f'Pod ready: id={pod_id} ip={ip} ssh_port={port}')
              print(f'Selected GPU: {gpu_type} | price/hr: {cost_str}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'ip={ip}\nport={port}\n')
                  output.write(f'gpu_type={gpu_type}\n')
                  output.write(f'cost_per_hr={cost_str}\n')
          except Exception:
              best_effort_delete(pod_id)
              raise
          PY

      - name: Wait for SSH
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          for i in $(seq 1 18); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
              -i /tmp/runpod_key -p "$PORT" "root@$IP" 'echo OK' \
              2>/dev/null | grep -q OK; then
              echo 'SSH ready'
              exit 0
            fi
            echo "SSH not ready ($i/18)"
            sleep 5
          done
          echo 'ERROR: SSH never came up'
          exit 1

      - name: Upload + run GPU preflight (must PASS before continuing)
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          $SCP runpod_gpu_preflight.sh root@$IP:/tmp/runpod_gpu_preflight.sh
          $SSH root@$IP "chmod +x /tmp/runpod_gpu_preflight.sh"

          set +e
          $SSH root@$IP "stdbuf -oL -eL /tmp/runpod_gpu_preflight.sh" | tee preflight_output.txt
          preflight_rc=${PIPESTATUS[0]}
          set -e
          if [ "$preflight_rc" -ne 0 ] || ! grep -q '^PREFLIGHT_RESULT=PASS$' preflight_output.txt; then
            echo "::error::RunPod GPU preflight did NOT pass (exit $preflight_rc) -- aborting before bootstrap/footage."
            exit 1
          fi
          echo 'Preflight PASSED.'

      - name: Upload + run environment bootstrap (must exit 0 before continuing)
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          $SCP runpod_bootstrap.sh root@$IP:/tmp/runpod_bootstrap.sh
          $SSH root@$IP "chmod +x /tmp/runpod_bootstrap.sh"

          set +e
          $SSH root@$IP "stdbuf -oL -eL /tmp/runpod_bootstrap.sh" | tee bootstrap_output.txt
          bootstrap_rc=${PIPESTATUS[0]}
          set -e
          if [ "$bootstrap_rc" -ne 0 ]; then
            echo "::error::runpod_bootstrap.sh failed (exit $bootstrap_rc) -- aborting before footage download."
            exit 1
          fi
          echo 'Bootstrap PASSED (reco-cli built with --features cuda).'

      - name: Verify exact validated Reco revision
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          EXPECTED_RECO_SHA='53fe10f548d5767ad94ef66aeaedf2d8c7161f27'
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          actual=$($SSH root@$IP "sed -n 's/^video-stitcher_sha=//p' /tmp/runpod_bootstrap_versions.log | tail -1")
          echo "Reco SHA built by bootstrap: $actual"
          if [ "$actual" != "$EXPECTED_RECO_SHA" ]; then
            echo "::error::Expected validated Reco SHA $EXPECTED_RECO_SHA, got ${actual:-missing}. Aborting before footage download."
            exit 1
          fi
          echo 'Reco revision gate PASSED.'

      - name: Resolve clip file IDs in OEV Drive root folder (full source clips)
        id: resolve
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          LEFT_CLIP: ${{ github.event.inputs.left_clip }}
          RIGHT_CLIP: ${{ github.event.inputs.right_clip }}
        run: |
          echo "$YOUTUBE_TOKEN" > /tmp/youtube_token.json
          echo "$YOUTUBE_CREDENTIALS" > /tmp/youtube_credentials.json
          python3 -u - << 'PY'
          import json
          import os
          import urllib.parse
          import urllib.request as req

          OEV_DRIVE_FOLDER_ID = '18Y8hI_S29BMeg5FEoxlaqoGy1DsQ7GKJ'
          token_data = json.loads(open('/tmp/youtube_token.json').read())
          creds_data = json.loads(open('/tmp/youtube_credentials.json').read())
          payload = json.dumps({
              'client_id': token_data.get('client_id') or creds_data['installed']['client_id'],
              'client_secret': token_data.get('client_secret') or creds_data['installed']['client_secret'],
              'refresh_token': token_data['refresh_token'],
              'grant_type': 'refresh_token',
          }).encode()
          response = req.urlopen(req.Request(
              'https://oauth2.googleapis.com/token',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          ))
          token = json.loads(response.read())
          if 'access_token' not in token:
              raise RuntimeError(f'Token refresh failed: {token}')
          access_token = token['access_token']
          open('/tmp/drive_token.txt', 'w').write(access_token)

          def find_in_drive_root(filename):
              q = f"name='{filename}' and '{OEV_DRIVE_FOLDER_ID}' in parents and trashed=false"
              url = 'https://www.googleapis.com/drive/v3/files?' + urllib.parse.urlencode({
                  'q': q,
                  'fields': 'files(id,name)',
                  'supportsAllDrives': 'true',
                  'includeItemsFromAllDrives': 'true',
              })
              response = req.urlopen(req.Request(
                  url,
                  headers={'Authorization': f'Bearer {access_token}'},
              ))
              files = json.loads(response.read()).get('files', [])
              if not files:
                  raise RuntimeError(
                      f'{filename} not found in OEV Drive root folder (id={OEV_DRIVE_FOLDER_ID})'
                  )
              return files[0]['id']

          left_id = find_in_drive_root(os.environ['LEFT_CLIP'])
          right_id = find_in_drive_root(os.environ['RIGHT_CLIP'])
          print(f'left_clip_id={left_id}')
          print(f'right_clip_id={right_id}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'left_id={left_id}\nright_id={right_id}\n')
          PY

      - name: Download clip pair to pod
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
          LEFT_ID: ${{ steps.resolve.outputs.left_id }}
          RIGHT_ID: ${{ steps.resolve.outputs.right_id }}
        run: |
          ACCESS_TOKEN=$(cat /tmp/drive_token.txt)
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes root@$IP"
          $SSH "apt-get update -qq && apt-get install -y -qq --no-install-recommends aria2 >/dev/null && mkdir -p /tmp/oev_run"
          $SSH "set -o pipefail; aria2c -x 8 -s 8 --file-allocation=none --header='Authorization: Bearer $ACCESS_TOKEN' --dir=/tmp/oev_run --out=left.mp4 'https://www.googleapis.com/drive/v3/files/$LEFT_ID?alt=media' 2>&1 | tail -5"
          $SSH "set -o pipefail; aria2c -x 8 -s 8 --file-allocation=none --header='Authorization: Bearer $ACCESS_TOKEN' --dir=/tmp/oev_run --out=right.mp4 'https://www.googleapis.com/drive/v3/files/$RIGHT_ID?alt=media' 2>&1 | tail -5"
          $SSH "test -s /tmp/oev_run/left.mp4 && test -s /tmp/oev_run/right.mp4 && ls -lh /tmp/oev_run/left.mp4 /tmp/oev_run/right.mp4"

      - name: Upload + run follow-cam test script
        id: run_followcam
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
          LEFT_CLIP: ${{ github.event.inputs.left_clip }}
          RIGHT_CLIP: ${{ github.event.inputs.right_clip }}
        run: |
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes root@$IP"
          SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          $SCP runpod_followcam_remote.sh root@$IP:/tmp/oev_run/
          $SSH "chmod +x /tmp/oev_run/runpod_followcam_remote.sh"

          # Bootstrap exports live only in its SSH shell. Reconstruct the
          # exact proven runtime environment in the shell that runs the real
          # football workload; do not install anything here.
          remote_cmd="test -d /usr/local/cuda-12.8/lib64 && test -f /tmp/nvidia_egl_icd.json || { echo 'FATAL: validated RunPod CUDA/Vulkan runtime files missing'; exit 10; }; export LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:\${LD_LIBRARY_PATH:-}; export VK_DRIVER_FILES=/tmp/nvidia_egl_icd.json; export VK_ICD_FILENAMES=/tmp/nvidia_egl_icd.json; unset DISPLAY; LEFT_CLIP='$LEFT_CLIP' RIGHT_CLIP='$RIGHT_CLIP' stdbuf -oL -eL /tmp/oev_run/runpod_followcam_remote.sh"
          processing_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "processing_start=$processing_start" >> "$GITHUB_OUTPUT"
          remote_rc=0
          $SSH "$remote_cmd" || remote_rc=$?
          processing_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "processing_end=$processing_end" >> "$GITHUB_OUTPUT"
          echo "remote_exit=$remote_rc" >> "$GITHUB_OUTPUT"
          echo "Remote follow-cam script exit: $remote_rc"
          echo "Processing window: $processing_start -> $processing_end"

      - name: Pull back logs + outputs
        if: always()
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
          POD_ID: ${{ steps.launch.outputs.pod_id }}
          GPU_TYPE: ${{ steps.launch.outputs.gpu_type }}
          COST_PER_HR: ${{ steps.launch.outputs.cost_per_hr }}
          LAUNCH_TIME: ${{ steps.launch.outputs.launch_time }}
          PROCESSING_START: ${{ steps.run_followcam.outputs.processing_start }}
          PROCESSING_END: ${{ steps.run_followcam.outputs.processing_end }}
        run: |
          mkdir -p followcam_artifacts
          cp preflight_output.txt followcam_artifacts/ 2>/dev/null || true
          cp bootstrap_output.txt followcam_artifacts/ 2>/dev/null || true

          duration_str="unavailable"
          cost_str="unavailable"
          if [ -n "$PROCESSING_START" ] && [ -n "$PROCESSING_END" ]; then
            start_s=$(date -u -d "$PROCESSING_START" +%s 2>/dev/null || echo "")
            end_s=$(date -u -d "$PROCESSING_END" +%s 2>/dev/null || echo "")
            if [ -n "$start_s" ] && [ -n "$end_s" ]; then
              dur_s=$((end_s - start_s))
              duration_str="${dur_s}s"
              if [ -n "$COST_PER_HR" ] && [ "$COST_PER_HR" != "unavailable" ]; then
                cost_str=$(python3 -c "print(f'{$COST_PER_HR * $dur_s / 3600:.4f}')" 2>/dev/null || echo "unavailable")
              fi
            fi
          fi

          echo "RunPod job summary: gpu=$GPU_TYPE price_per_hr=$COST_PER_HR pod_id=$POD_ID launch_time=$LAUNCH_TIME processing_start=$PROCESSING_START processing_end=$PROCESSING_END duration=$duration_str approx_cost=$cost_str"

          cat > followcam_artifacts/run_metadata.txt <<META
          pod_id=$POD_ID
          ip=$IP
          port=$PORT
          gpu_type=$GPU_TYPE
          cost_per_hr=$COST_PER_HR
          launch_time=$LAUNCH_TIME
          processing_start=$PROCESSING_START
          processing_end=$PROCESSING_END
          processing_duration=$duration_str
          approx_processing_cost=$cost_str
          META

          if [ -z "$IP" ] || [ -z "$PORT" ]; then
            echo 'No SSH endpoint available; skipping remote artifact pull.'
            exit 0
          fi

          SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          for file in segment.log calibrate.log stitch.log acceptance.log match.json events.jsonl followcam.mp4; do
            $SCP "root@$IP:/tmp/oev_run/$file" followcam_artifacts/ || echo "$file missing"
          done

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oev-runpod-followcam-${{ github.run_id }}
          path: followcam_artifacts/
          retention-days: 14

      - name: Upload follow-cam result to OEV Drive Followcam/ folder
        id: drive_upload
        if: always()
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          LEFT_CLIP: ${{ github.event.inputs.left_clip }}
        run: |
          pip install -q google-auth google-auth-oauthlib google-api-python-client

          if [ ! -s followcam_artifacts/followcam.mp4 ]; then
            echo 'followcam.mp4 missing/empty -- nothing to upload (remote script did not produce output).'
            echo 'drive_upload_verified=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$YOUTUBE_TOKEN" > /tmp/youtube_token.json
          echo "$YOUTUBE_CREDENTIALS" > /tmp/youtube_credentials.json

          set +e
          python3 -u - << 'PY'
          import json, sys
          sys.path.insert(0, '.')
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          import os

          OEV_DRIVE_FOLDER_ID = "18Y8hI_S29BMeg5FEoxlaqoGy1DsQ7GKJ"

          try:
              token_data = json.loads(open('/tmp/youtube_token.json').read())
              creds_data = json.loads(open('/tmp/youtube_credentials.json').read())
              creds = Credentials(
                  token=None,
                  refresh_token=token_data['refresh_token'],
                  token_uri=token_data.get('token_uri', 'https://oauth2.googleapis.com/token'),
                  client_id=token_data.get('client_id') or creds_data['installed']['client_id'],
                  client_secret=token_data.get('client_secret') or creds_data['installed']['client_secret'],
              )
              drive = build('drive', 'v3', credentials=creds)

              res = drive.files().list(
                  q=f"name='Followcam' and '{OEV_DRIVE_FOLDER_ID}' in parents and trashed=false and mimeType='application/vnd.google-apps.folder'",
                  fields="files(id)", supportsAllDrives=True, includeItemsFromAllDrives=True,
              ).execute()
              files = res.get('files', [])
              if files:
                  followcam_id = files[0]['id']
              else:
                  folder = drive.files().create(
                      body={'name': 'Followcam', 'mimeType': 'application/vnd.google-apps.folder', 'parents': [OEV_DRIVE_FOLDER_ID]},
                      fields='id',
                  ).execute()
                  followcam_id = folder['id']

              left_clip = os.environ['LEFT_CLIP']
              local_size = os.path.getsize('followcam_artifacts/followcam.mp4')
              out_name = f"followcam_{left_clip}"
              media = MediaFileUpload('followcam_artifacts/followcam.mp4', mimetype='video/mp4', resumable=True)
              uploaded = drive.files().create(
                  body={'name': out_name, 'parents': [followcam_id]},
                  media_body=media, fields='id', supportsAllDrives=True,
              ).execute()
              file_id = uploaded['id']
              print(f"Uploaded followcam.mp4 -> Drive file id {file_id}")

              # Verify: fetch the uploaded file's metadata back and compare size.
              verify = drive.files().get(
                  fileId=file_id, fields='id,size', supportsAllDrives=True,
              ).execute()
              remote_size = int(verify.get('size', -1))
              if remote_size != local_size:
                  raise RuntimeError(
                      f"Upload verification failed: local size {local_size} != Drive size {remote_size} (file id {file_id})"
                  )
              print(f"Verified: Drive file {file_id} size {remote_size} matches local.")

              events_path = 'followcam_artifacts/events.jsonl'
              if os.path.exists(events_path) and os.path.getsize(events_path) > 0:
                  events_name = f"events_{left_clip}.jsonl"
                  events_media = MediaFileUpload(events_path, mimetype='application/json', resumable=True)
                  events_uploaded = drive.files().create(
                      body={'name': events_name, 'parents': [followcam_id]},
                      media_body=events_media, fields='id', supportsAllDrives=True,
                  ).execute()
                  print(f"Uploaded events.jsonl -> Drive file id {events_uploaded['id']}")

              with open(os.environ['GITHUB_OUTPUT'], 'a') as gh_out:
                  gh_out.write('drive_upload_verified=true\n')
                  gh_out.write(f'drive_file_id={file_id}\n')
          except Exception as exc:
              print(f"::error::Drive upload/verification failed: {exc}", file=sys.stderr)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as gh_out:
                  gh_out.write('drive_upload_verified=false\n')
              sys.exit(0)  # do not fail this step directly -- acceptance step reports it
          PY
          set -e

      - name: Terminate RunPod pod
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID: ${{ steps.launch.outputs.pod_id }}
        run: |
          python3 -u - << 'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          pod_id = os.environ.get('POD_ID', '').strip()
          if not pod_id:
              print('No pod ID -- nothing to terminate (POST likely never created a pod).')
              raise SystemExit(0)

          headers = {'Authorization': f"Bearer {os.environ['RUNPOD_API_KEY']}"}
          url = f'https://rest.runpod.io/v1/pods/{pod_id}'
          last_error = None

          for attempt in range(1, 4):
              req = urllib.request.Request(url, method='DELETE', headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      status = response.status
                      if status in (200, 202, 204):
                          print(f'Pod {pod_id} termination confirmed (HTTP {status}) on attempt {attempt}.')
                          raise SystemExit(0)
                      last_error = f'unexpected HTTP {status}'
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print(f'Pod {pod_id} already absent (HTTP 404) -- cleanup confirmed.')
                      raise SystemExit(0)
                  body = exc.read().decode(errors='replace')[:300]
                  last_error = f'HTTP {exc.code}: {body}'
              except Exception as exc:
                  last_error = repr(exc)

              print(f'DELETE attempt {attempt}/3 failed: {last_error}')
              if attempt < 3:
                  time.sleep(5)

          print(f'::error::Pod {pod_id} termination NOT confirmed after 3 attempts: {last_error}')
          print('::error::Check the RunPod console manually; workflow is failing cleanup rather than hiding a potentially billable pod.')
          raise SystemExit(1)
          PY

      - name: Evaluate acceptance
        if: always()
        env:
          REMOTE_EXIT: ${{ steps.run_followcam.outputs.remote_exit }}
          DRIVE_UPLOAD_VERIFIED: ${{ steps.drive_upload.outputs.drive_upload_verified }}
          DRIVE_FILE_ID: ${{ steps.drive_upload.outputs.drive_file_id }}
          POD_ID: ${{ steps.launch.outputs.pod_id }}
        run: |
          echo "Remote script exit code: ${REMOTE_EXIT:-unknown}"
          echo "Drive upload verified: ${DRIVE_UPLOAD_VERIFIED:-unknown}"
          if [ "${REMOTE_EXIT:-1}" != '0' ]; then
            echo "::error::RunPod follow-cam test did NOT pass (remote exit ${REMOTE_EXIT:-unknown}). See artifact logs."
            exit 1
          fi
          if [ "${DRIVE_UPLOAD_VERIFIED:-false}" != 'true' ]; then
            echo "::error::Drive upload was not verified for pod ${POD_ID:-unknown} (already terminated). Recovery: the run's GitHub Actions artifact 'oev-runpod-followcam-${{ github.run_id }}' still holds followcam.mp4/events.jsonl locally -- download it and upload to Drive manually, or re-dispatch this workflow."
            exit 1
          fi
          echo "Follow-cam test PASSED acceptance (AI tracking confirmed; Drive upload verified as file ${DRIVE_FILE_ID:-unknown}; --no-zero-copy interim setting, see runpod_followcam_remote.sh header)."
