name: OEV — Sample Dataset Prep (5 locations x 3 durations, no GPU)

# One-time (or rare re-run) dataset-generation job: picks 5 randomized,
# non-clustered start timestamps from a full-source stereo pair already in
# the OEV Drive root folder, cuts a 180s/60s/30s clip at each location
# (stream copy only -- 60s/30s derived from the 180s cut, source never
# decoded more than once per location per side), writes a manifest.json,
# and uploads the full set to Drive under Samples/<sample-set-id>/.
#
# This is deliberately NOT wired into any benchmark/test run -- it is run
# manually, on purpose, whenever a new sample set is wanted. Staging the
# resulting set onto RunPod network volumes is a separate workflow
# (oev-populate-volume-samples.yml).

on:
  workflow_dispatch:
    inputs:
      left_clip:
        description: 'Full source left clip filename in OEV Drive root'
        required: false
        default: 'GX010197.MP4'
        type: string
      right_clip:
        description: 'Full source right clip filename in OEV Drive root'
        required: false
        default: 'GX010173.MP4'
        type: string
      seed:
        description: 'Optional random seed for reproducible sample selection (blank = fresh random seed, recorded in the manifest)'
        required: false
        default: ''
        type: string
      starts:
        description: 'OEV-006: optional comma-separated fixed start times in seconds (left file), e.g. 1000,1550,2090. Blank = random seeded picks.'
        required: false
        default: ''
        type: string
      durations:
        description: 'Optional comma-separated clip durations in seconds, e.g. 300. Blank = 30,60,180.'
        required: false
        default: ''
        type: string
      set_id:
        description: 'Explicit sample_set_id (required with starts).'
        required: false
        default: ''
        type: string
      copy_to_r2:
        description: 'OEV-006: copy the four source videos Drive -> R2 (oev/sources/) via temporary server-side Drive copies (fresh download quota; deleted after R2 verify). Resumable. Skips all other steps.'
        required: false
        default: false
        type: boolean
      source_from_r2:
        description: 'OEV-006: cut fixed windows from the R2 copies (oev/sources/<name>) instead of Drive. Requires copy_to_r2 to have completed.'
        required: false
        default: false
        type: boolean
      probe_only:
        description: 'OEV-006: only test authenticated Drive API access (one ~1 MB ranged GET + one 10 s cut), then stop. No full download, no uploads.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare-sample-dataset:
    name: Generate 5x3 sample clips + manifest, upload to Drive
    # ffmpeg stream-copy trims only -- no decode/re-encode, no GPU needed.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.copy_to_r2 && 350 || 90 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve full-source clip IDs in OEV Drive root folder
        id: resolve
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          LEFT_CLIP: ${{ inputs.left_clip }}
          RIGHT_CLIP: ${{ inputs.right_clip }}
        run: |
          echo "$YOUTUBE_TOKEN" > /tmp/youtube_token.json
          echo "$YOUTUBE_CREDENTIALS" > /tmp/youtube_credentials.json
          python3 -u - << 'PY'
          import json
          import os
          import urllib.parse
          import urllib.request as req

          OEV_DRIVE_FOLDER_ID = '18Y8hI_S29BMeg5FEoxlaqoGy1DsQ7GKJ'
          token_data = json.loads(open('/tmp/youtube_token.json').read())
          creds_data = json.loads(open('/tmp/youtube_credentials.json').read())
          payload = json.dumps({
              'client_id': token_data.get('client_id') or creds_data['installed']['client_id'],
              'client_secret': token_data.get('client_secret') or creds_data['installed']['client_secret'],
              'refresh_token': token_data['refresh_token'],
              'grant_type': 'refresh_token',
          }).encode()
          response = req.urlopen(req.Request(
              'https://oauth2.googleapis.com/token',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          ))
          token = json.loads(response.read())
          if 'access_token' not in token:
              raise RuntimeError(f'Token refresh failed: {token}')
          access_token = token['access_token']
          open('/tmp/drive_token.txt', 'w').write(access_token)

          def find_in_drive_root(filename):
              q = f"name='{filename}' and '{OEV_DRIVE_FOLDER_ID}' in parents and trashed=false"
              url = 'https://www.googleapis.com/drive/v3/files?' + urllib.parse.urlencode({
                  'q': q,
                  'fields': 'files(id,name)',
                  'supportsAllDrives': 'true',
                  'includeItemsFromAllDrives': 'true',
              })
              response = req.urlopen(req.Request(
                  url,
                  headers={'Authorization': f'Bearer {access_token}'},
              ))
              files = json.loads(response.read()).get('files', [])
              if not files:
                  raise RuntimeError(f'{filename} not found in OEV Drive root folder')
              return files[0]['id']

          left_id = find_in_drive_root(os.environ['LEFT_CLIP'])
          right_id = find_in_drive_root(os.environ['RIGHT_CLIP'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'left_id={left_id}\nright_id={right_id}\n')
          PY

      - name: Copy source videos Drive -> R2 (copy_to_r2)
        if: inputs.copy_to_r2
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: |
          set -o pipefail
          export DRIVE_ACCESS_TOKEN=$(cat /tmp/drive_token.txt)
          echo "::add-mask::$DRIVE_ACCESS_TOKEN"
          pip install -q boto3
          python3 -u scripts/oev_drive_to_r2.py --part-mb 256 --budget-min 320 --temp-copies \
            --file GX010197.MP4=1WaXjRq-QSwKseCZM7X_GJgZVqU3LffPE \
            --file GX010173.MP4=1iUJe84rQUkyFBo6BBZnhNBWQQp6LMSay \
            --file GX010175.MP4=1_b4_ojm8iqyMNFtd6qYdfQdke253FQqI \
            --file GX010198.MP4=10Wui460oIqnMMR-5U7EzKuCHBkYMgIDB

      - name: Probe authenticated Drive API access (probe_only)
        if: inputs.probe_only && !inputs.copy_to_r2
        env:
          LEFT_ID: ${{ steps.resolve.outputs.left_id }}
        run: |
          set -o pipefail
          ACCESS_TOKEN=$(cat /tmp/drive_token.txt)
          echo "::add-mask::$ACCESS_TOKEN"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          URL="https://www.googleapis.com/drive/v3/files/$LEFT_ID?alt=media&acknowledgeAbuse=false"
          code=$(curl -s -o /tmp/probe.bin -D /tmp/probe.hdr -w '%{http_code}' -r 0-1048575 \
            -H "Authorization: Bearer $ACCESS_TOKEN" "$URL")
          echo "ranged GET status=$code bytes=$(stat -c %s /tmp/probe.bin)"
          grep -iE '^(content-type|content-range|content-length):' /tmp/probe.hdr || true
          if [ "$code" != "206" ]; then
            echo "::error::Drive API ranged GET returned $code (not 206); body head:"
            head -c 400 /tmp/probe.bin; echo
            exit 1
          fi
          if head -c 12 /tmp/probe.bin | grep -q ftyp; then echo "MP4 signature (ftyp) present: genuine video bytes"; else echo "::error::no ftyp signature"; exit 1; fi
          export DRIVE_AUTH_HEADER="Authorization: Bearer $ACCESS_TOKEN"
          # ffmpeg's own first request is unranged (whole file), which the
          # quota blocks; the proxy turns every read into a bounded range.
          nohup python3 scripts/oev_drive_range_proxy.py 8765 > /tmp/range_proxy.log 2>&1 &
          for i in $(seq 1 20); do curl -fsI "http://127.0.0.1:8765/$LEFT_ID" >/dev/null 2>&1 && break; sleep 1; done
          mkdir -p /tmp/probe_cut
          python3 scripts/oev_generate_sample_dataset.py \
            --left "http://127.0.0.1:8765/$LEFT_ID" \
            --right "http://127.0.0.1:8765/$LEFT_ID" \
            --left-name probe.MP4 --right-name probe.MP4 \
            --outdir /tmp/probe_cut --starts 1000 --durations 10 --set-id probe 2>&1 | tail -3 || { tail -5 /tmp/range_proxy.log; exit 1; }
          f=/tmp/probe_cut/sample_01/sample_01_left_10s.mp4
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
          frames=$(ffprobe -v error -count_packets -select_streams v:0 -show_entries stream=nb_read_packets -of csv=p=0 "$f")
          echo "PROBE OK: 10 s cut playable: duration=${dur}s video_packets=${frames} size=$(stat -c %s "$f")"

      - name: Download full source clips
        if: ${{ !inputs.probe_only && !inputs.copy_to_r2 }}
        env:
          LEFT_ID: ${{ steps.resolve.outputs.left_id }}
          RIGHT_ID: ${{ steps.resolve.outputs.right_id }}
          STARTS_INPUT: ${{ inputs.starts }}
        run: |
          ACCESS_TOKEN=$(cat /tmp/drive_token.txt)
          echo "::add-mask::$ACCESS_TOKEN"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends aria2 ffmpeg
          if [ -n "$STARTS_INPUT" ]; then
            # OEV-006: fixed windows are cut straight from Drive by ranged
            # reads in the next step; no full-source download (avoids the
            # multi-GB parallel download Drive throttles with HTTP 403).
            echo "Fixed starts given: skipping full-source download"
            exit 0
          fi
          mkdir -p /tmp/oev_pack
          aria2c -x 8 -s 8 --file-allocation=none --header="Authorization: Bearer $ACCESS_TOKEN" \
            --dir=/tmp/oev_pack --out=left_full.mp4 "https://www.googleapis.com/drive/v3/files/$LEFT_ID?alt=media"
          aria2c -x 8 -s 8 --file-allocation=none --header="Authorization: Bearer $ACCESS_TOKEN" \
            --dir=/tmp/oev_pack --out=right_full.mp4 "https://www.googleapis.com/drive/v3/files/$RIGHT_ID?alt=media"
          test -s /tmp/oev_pack/left_full.mp4 && test -s /tmp/oev_pack/right_full.mp4
          ls -lh /tmp/oev_pack/

      - name: Generate sample dataset (5 locations x 30/60/180s, both sides)
        if: ${{ !inputs.probe_only && !inputs.copy_to_r2 }}
        id: generate
        env:
          LEFT_CLIP: ${{ inputs.left_clip }}
          RIGHT_CLIP: ${{ inputs.right_clip }}
          SEED_INPUT: ${{ inputs.seed }}
          STARTS_INPUT: ${{ inputs.starts }}
          DURATIONS_INPUT: ${{ inputs.durations }}
          SET_ID_INPUT: ${{ inputs.set_id }}
          SOURCE_FROM_R2: ${{ inputs.source_from_r2 }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          LEFT_ID: ${{ steps.resolve.outputs.left_id }}
          RIGHT_ID: ${{ steps.resolve.outputs.right_id }}
        run: |
          SEED_ARG=""
          if [ -n "$SEED_INPUT" ]; then
            SEED_ARG="--seed $SEED_INPUT"
          fi
          EXTRA_ARGS=()
          [ -n "$STARTS_INPUT" ] && EXTRA_ARGS+=(--starts "$STARTS_INPUT")
          [ -n "$DURATIONS_INPUT" ] && EXTRA_ARGS+=(--durations "$DURATIONS_INPUT")
          [ -n "$SET_ID_INPUT" ] && EXTRA_ARGS+=(--set-id "$SET_ID_INPUT")
          set -o pipefail
          LEFT_SRC=/tmp/oev_pack/left_full.mp4
          RIGHT_SRC=/tmp/oev_pack/right_full.mp4
          if [ -n "$STARTS_INPUT" ] && [ "$SOURCE_FROM_R2" = "true" ]; then
            # OEV-006: R2 has no per-file download quota; ffmpeg reads
            # presigned URLs directly with HTTP range requests.
            sudo mkdir -p /mnt/oev_samples && sudo chown "$USER" /mnt/oev_samples
            ln -sfn /mnt/oev_samples /tmp/oev_samples
            pip install -q boto3
            read -r LEFT_SRC RIGHT_SRC < <(python3 - <<'PY'
          import os, boto3
          from botocore.config import Config
          s3 = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT_URL"], aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"], region_name="auto", config=Config(signature_version="s3v4"))
          b = os.environ["S3_BUCKET"]
          urls = []
          for name in (os.environ["LEFT_CLIP"], os.environ["RIGHT_CLIP"]):
              key = "oev/sources/" + name
              s3.head_object(Bucket=b, Key=key)  # fails loudly if the copy has not finished
              urls.append(s3.generate_presigned_url("get_object", Params={"Bucket": b, "Key": key}, ExpiresIn=6 * 3600))
          for u in urls:
              print(f"::add-mask::{u}")
          print(" ".join(urls))
          PY
          )
          elif [ -n "$STARTS_INPUT" ]; then
            # OEV-006: cut fixed windows by ranged reads through a local
            # proxy (scripts/oev_drive_range_proxy.py); the Drive API path
            # returned 403 after the throttled bulk download. Clips go on
            # the large /mnt disk (~2.2 GB per 300 s side).
            sudo mkdir -p /mnt/oev_samples && sudo chown "$USER" /mnt/oev_samples
            ln -sfn /mnt/oev_samples /tmp/oev_samples
            ACCESS_TOKEN=$(cat /tmp/drive_token.txt)
            echo "::add-mask::$ACCESS_TOKEN"
            # Authenticated Drive API upstream, bounded ranged reads only.
            export DRIVE_AUTH_HEADER="Authorization: Bearer $ACCESS_TOKEN"
            nohup python3 scripts/oev_drive_range_proxy.py 8765 > /tmp/range_proxy.log 2>&1 &
            for i in $(seq 1 20); do curl -fsI "http://127.0.0.1:8765/$LEFT_ID" >/dev/null 2>&1 && break; sleep 1; done
            LEFT_SRC="http://127.0.0.1:8765/$LEFT_ID"
            RIGHT_SRC="http://127.0.0.1:8765/$RIGHT_ID"
          fi
          mkdir -p /tmp/oev_samples
          python3 scripts/oev_generate_sample_dataset.py \
            --left "$LEFT_SRC" \
            --right "$RIGHT_SRC" \
            --left-name "$LEFT_CLIP" \
            --right-name "$RIGHT_CLIP" \
            --outdir /tmp/oev_samples \
            $SEED_ARG "${EXTRA_ARGS[@]}" | tee /tmp/oev_samples/generate_stdout.log

          SAMPLE_SET_ID=$(grep '^sample_set_id=' /tmp/oev_samples/generate_stdout.log | cut -d= -f2)
          echo "sample_set_id=$SAMPLE_SET_ID" >> "$GITHUB_OUTPUT"

      - name: Upload sample dataset (artifact)
        if: always() && inputs.starts == '' && !inputs.probe_only && !inputs.copy_to_r2
        uses: actions/upload-artifact@v4
        with:
          name: oev-sample-dataset-${{ github.run_id }}
          path: /tmp/oev_samples/
          retention-days: 30

      - name: Upload manifest + logs only (fixed windows; clips go to Drive)
        if: always() && inputs.starts != '' && !inputs.probe_only && !inputs.copy_to_r2
        uses: actions/upload-artifact@v4
        with:
          name: oev-sample-dataset-${{ github.run_id }}
          path: |
            /tmp/oev_samples/manifest.json
            /tmp/oev_samples/generate.log
            /tmp/oev_samples/generate_stdout.log
            /tmp/range_proxy.log
          retention-days: 30

      - name: Upload sample dataset to OEV Drive Samples/<sample-set-id>/ folder
        if: ${{ !inputs.probe_only && !inputs.copy_to_r2 }}
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          SAMPLE_SET_ID: ${{ steps.generate.outputs.sample_set_id }}
        run: |
          pip install -q google-auth google-auth-oauthlib google-api-python-client
          python3 -u - << 'PY'
          import json, os, sys
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          OEV_DRIVE_FOLDER_ID = '18Y8hI_S29BMeg5FEoxlaqoGy1DsQ7GKJ'
          SAMPLE_SET_ID = os.environ['SAMPLE_SET_ID']

          token_data = json.loads(open('/tmp/youtube_token.json').read())
          creds_data = json.loads(open('/tmp/youtube_credentials.json').read())
          creds = Credentials(
              token=None,
              refresh_token=token_data['refresh_token'],
              token_uri=token_data.get('token_uri', 'https://oauth2.googleapis.com/token'),
              client_id=token_data.get('client_id') or creds_data['installed']['client_id'],
              client_secret=token_data.get('client_secret') or creds_data['installed']['client_secret'],
          )
          drive = build('drive', 'v3', credentials=creds)

          def find_or_create_folder(name, parent):
              res = drive.files().list(
                  q=f"name='{name}' and '{parent}' in parents and trashed=false and mimeType='application/vnd.google-apps.folder'",
                  fields='files(id)', supportsAllDrives=True, includeItemsFromAllDrives=True,
              ).execute()
              files = res.get('files', [])
              if files:
                  return files[0]['id']
              folder = drive.files().create(
                  body={'name': name, 'mimeType': 'application/vnd.google-apps.folder', 'parents': [parent]},
                  fields='id',
              ).execute()
              return folder['id']

          samples_id = find_or_create_folder('Samples', OEV_DRIVE_FOLDER_ID)
          set_id = find_or_create_folder(SAMPLE_SET_ID, samples_id)

          local_root = Path('/tmp/oev_samples')
          uploaded = 0
          for path in sorted(local_root.rglob('*')):
              if not path.is_file():
                  continue
              if path.name == 'generate_stdout.log':
                  continue
              rel = path.relative_to(local_root)
              parent_id = set_id
              # mirror any sample_NN subdirectory as a Drive subfolder
              if len(rel.parts) > 1:
                  parent_id = find_or_create_folder(rel.parts[0], set_id)
              mimetype = 'video/mp4' if path.suffix == '.mp4' else 'application/octet-stream'
              media = MediaFileUpload(str(path), mimetype=mimetype, resumable=True)
              result = drive.files().create(
                  body={'name': path.name, 'parents': [parent_id]},
                  media_body=media, fields='id', supportsAllDrives=True,
              ).execute()
              file_id = result['id']
              local_size = path.stat().st_size
              verify = drive.files().get(fileId=file_id, fields='id,size', supportsAllDrives=True).execute()
              remote_size = int(verify.get('size', -1)) if path.suffix == '.mp4' else local_size
              if path.suffix == '.mp4' and remote_size != local_size:
                  print(f'::error::Upload verification failed for {path.name}: local {local_size} != remote {remote_size}')
                  sys.exit(1)
              uploaded += 1
              print(f'Uploaded {rel} -> Drive file id {file_id}')

          print(f'Done: {uploaded} file(s) uploaded to Samples/{SAMPLE_SET_ID}/')
          PY
