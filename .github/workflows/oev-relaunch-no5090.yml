name: OEV — one-shot exclude 5090 and relaunch stride3

on:
  push:
    branches:
      - experiment/lookahead-ball-containment-01

permissions:
  contents: read
  actions: write

jobs:
  patch-and-dispatch:
    if: github.event.head_commit.message == 'launch-stride3-eu-no5090'
    runs-on: ubuntu-latest
    steps:
      - name: Exclude RTX 5090 from experiment allocator
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request

          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          token = os.environ['GH_PAT']
          path = '.github/workflows/oev-runpod-sample-baseline.yml'
          api = f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          req = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as r:
              obj = json.load(r)
          text = base64.b64decode(obj['content']).decode()
          needle = "              'NVIDIA GeForce RTX 5090',\n"
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one RTX 5090 allocator entry, found {text.count(needle)}')
          text = text.replace(needle, '', 1)
          payload = json.dumps({
              'message': 'test: exclude RTX 5090 after Reco CUDA incompatibility',
              'content': base64.b64encode(text.encode()).decode(),
              'sha': obj['sha'],
              'branch': branch,
          }).encode()
          put = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{path}',
              data=payload, method='PUT', headers={**headers, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(put, timeout=30) as r:
              out = json.load(r)
          print('Updated workflow commit:', out['commit']['sha'])
          PY

      - name: Dispatch same EU 180s v4 stride3 test
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sleep 2
          payload=$(cat <<JSON
          {
            "ref": "${REF}",
            "inputs": {
              "datacenter": "EU-RO-1",
              "sample_id": "sample_01",
              "duration_s": "180",
              "sample_set_id": "GX010197-seed1384188843",
              "model_variant": "yolo26m",
              "lookahead": "1.5",
              "cluster_alpha_override": "0.08"
            }
          }
          JSON
          )
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/oev-runpod-sample-baseline.yml/dispatches" \
            -d "$payload")
          cat /tmp/body.txt || true
          test "$code" = '204'
          echo 'Dispatched EU stride3 test with RTX 5090 excluded.'
