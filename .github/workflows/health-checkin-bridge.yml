name: Johnson OS Check-in Bridge

on:
  schedule:
    # These paired UTC times keep the export at 06:50 Europe/London through DST.
    # Gate by scheduled cron, not runner time, because GitHub may queue scheduled runs.
    - cron: '50 5 * * *'
    - cron: '50 6 * * *'
  push:
    branches:
      - feature/johnson-os-github-bridge
    paths:
      - health-checkin/request.json
      - .github/workflows/health-checkin-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select one 06:50 London schedule
        id: gate
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          event = os.environ.get('GITHUB_EVENT_NAME', '')
          if event != 'schedule':
              print('run=true')
          else:
              now = datetime.now(ZoneInfo('Europe/London'))
              is_bst = now.utcoffset() == timedelta(hours=1)
              expected = '50 5 * * *' if is_bst else '50 6 * * *'
              scheduled = os.environ.get('SCHEDULE', '')
              run = scheduled == expected
              print('run=' + str(run).lower())
              print(f'london_time={now.isoformat()}')
              print(f'scheduled_cron={scheduled}')
              print(f'expected_cron={expected}')
          PY

      - name: Explain skipped DST duplicate
        if: github.event_name == 'schedule' && steps.gate.outputs.run != 'true'
        env:
          LONDON_TIME: ${{ steps.gate.outputs.london_time }}
          SCHEDULED_CRON: ${{ steps.gate.outputs.scheduled_cron }}
          EXPECTED_CRON: ${{ steps.gate.outputs.expected_cron }}
        run: |
          {
            echo "## No check-in export in this run"
            echo
            echo "The paired DST schedule selected $EXPECTED_CRON for the 06:50 London run. This run came from $SCHEDULED_CRON at $LONDON_TIME, so it was skipped as the duplicate."
            echo "No health data was fetched and no artifact was created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch check-in
        if: steps.gate.outputs.run == 'true'
        env:
          CHECKIN_EXPORT_KEY: ${{ secrets.CHECKIN_EXPORT_KEY }}
        run: |
          test -n "$CHECKIN_EXPORT_KEY" || { echo "Missing repository secret CHECKIN_EXPORT_KEY"; exit 1; }
          mkdir -p health-checkin
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -H "Authorization: Bearer $CHECKIN_EXPORT_KEY" \
            -H "Accept: application/json" \
            https://johnson-os-health-webhook.vercel.app/api/export \
            -o health-checkin/response.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('health-checkin/response.json').read_text())
          required = {'generated_at', 'date', 'today', 'yesterday', 'baseline_7d', 'hevy'}
          missing = sorted(required - payload.keys())
          if missing:
              raise SystemExit(f'Invalid check-in response; missing: {missing}')
          print('Check-in response validated; Hevy section present')
          PY

      - name: Encrypt response
        if: steps.gate.outputs.run == 'true'
        env:
          CHECKIN_ARTIFACT_KEY: ${{ secrets.CHECKIN_ARTIFACT_KEY }}
        run: |
          test -n "$CHECKIN_ARTIFACT_KEY" || { echo "Missing repository secret CHECKIN_ARTIFACT_KEY"; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const plaintext = fs.readFileSync('health-checkin/response.json');
          const key = crypto.createHash('sha256').update(process.env.CHECKIN_ARTIFACT_KEY, 'utf8').digest();
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          const ciphertext = Buffer.concat([cipher.update(plaintext), cipher.final()]);
          const envelope = {
            version: 1,
            algorithm: 'aes-256-gcm',
            key_derivation: 'sha256-utf8',
            iv_b64: iv.toString('base64'),
            tag_b64: cipher.getAuthTag().toString('base64'),
            ciphertext_b64: ciphertext.toString('base64')
          };
          fs.writeFileSync('health-checkin/response.enc.json', JSON.stringify(envelope));
          fs.rmSync('health-checkin/response.json');
          console.log('Encrypted check-in ready');
          NODE

      - name: Upload encrypted response
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: johnson-os-checkin-${{ github.run_id }}
          path: health-checkin/response.enc.json
          if-no-files-found: error
          retention-days: 1
