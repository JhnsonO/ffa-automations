name: OEV — Remove stale AP-JP volume mapping (temporary)

on:
  push:
    branches:
      - rollout/shared-buffer-main
    paths:
      - '.github/workflows/_remove-stale-apjp-volume.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VOLUME_MAP_JSON: ${{ vars.OEV_NETWORK_VOLUME_MAP }}
    steps:
      - name: Remove AP-JP-1 only if it still points to missing volume 6668h25wco
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          current=json.loads(os.environ['VOLUME_MAP_JSON'])
          expected='6668h25wco'
          if current.get('AP-JP-1') != expected:
              raise SystemExit(f"Refusing cleanup: AP-JP-1 currently maps to {current.get('AP-JP-1')!r}, expected stale {expected!r}")
          current.pop('AP-JP-1')
          value=json.dumps(current,separators=(',',':'))
          repo=os.environ['GITHUB_REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/actions/variables/OEV_NETWORK_VOLUME_MAP'
          body=json.dumps({'name':'OEV_NETWORK_VOLUME_MAP','value':value}).encode()
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          req=urllib.request.Request(url,data=body,method='PATCH',headers=headers)
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  print(f'variable update HTTP {r.status}')
          except urllib.error.HTTPError as e:
              print(e.read().decode(errors='replace'))
              raise
          print('UPDATED_VOLUME_MAP='+value)
          PY
