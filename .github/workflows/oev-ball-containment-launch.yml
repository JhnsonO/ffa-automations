name: OEV — one-shot v4 stride-3 US-IL launcher

on:
  push:
    branches:
      - experiment/lookahead-ball-containment-01

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'launch-v4-stride3-usil'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch same 180s v4 stride-3 sample on US-IL-1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload=$(cat <<JSON
          {
            "ref": "${REF}",
            "inputs": {
              "datacenter": "US-IL-1",
              "sample_id": "sample_01",
              "duration_s": "180",
              "sample_set_id": "GX010197-seed1384188843",
              "model_variant": "yolo26m",
              "lookahead": "1.5",
              "cluster_alpha_override": "0.08"
            }
          }
          JSON
          )
          code=$(curl -sS -o /tmp/dispatch-body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/oev-runpod-sample-baseline.yml/dispatches" \
            -d "$payload")
          cat /tmp/dispatch-body.txt || true
          test "$code" = "204" || { echo "::error::workflow dispatch returned HTTP $code"; exit 1; }
          echo "Dispatched v4 stride-3 experiment on US-IL-1"
