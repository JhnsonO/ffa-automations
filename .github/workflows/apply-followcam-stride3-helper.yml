name: Apply follow-cam stride 3 helper

on:
  push:
    branches: [feature/frame-stride-testing]
    paths:
      - .github/workflows/apply-followcam-stride3-helper.yml
      - tools/apply_followcam_stride3.py

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[followcam-stride3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/frame-stride-testing
      - name: Wire stride 3
        run: |
          python3 tools/apply_followcam_stride3.py
          grep -q -- '--frame-stride 3' runpod_followcam_remote.sh
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runpod_followcam_remote.sh
          git commit -m 'feat: use stride 3 for production follow-cam [followcam-stride3]'
          git push origin HEAD:feature/frame-stride-testing
