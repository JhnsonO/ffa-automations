name: OEV — one-shot broaden EU stride-3 launcher

on:
  push:
    branches:
      - experiment/lookahead-ball-containment-01

permissions:
  actions: write
  contents: read

jobs:
  patch-and-dispatch:
    if: github.event.head_commit.message == 'retry-v4-stride3-eu-broaden-launcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Broaden pinned-EU allocator and avoid repeated bad GPU type
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/oev-runpod-sample-baseline.yml')
          s = p.read_text()

          old = 'Launch RunPod GPU pod (NVDEC preflight retry, max 3 attempts, pinned datacenter)'
          new = 'Launch RunPod GPU pod (NVDEC preflight retry, max 6 attempts, pinned datacenter, GPU failover)'
          if s.count(old) != 1:
              raise SystemExit(f'step-name anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '          MAX_ATTEMPTS = 3\n'
          new = (
              '          MAX_ATTEMPTS = 6\n'
              '          # Same wide GPU fallback pool already used by the production runtime allocator.\n'
              '          GPU_TYPES_WIDE = [\n'
              "              'NVIDIA GeForce RTX 4090',\n"
              "              'NVIDIA RTX A5000',\n"
              "              'NVIDIA GeForce RTX 3090',\n"
              "              'NVIDIA L4',\n"
              "              'NVIDIA L40S',\n"
              "              'NVIDIA GeForce RTX 5090',\n"
              "              'NVIDIA RTX 2000 Ada Generation',\n"
              "              'NVIDIA RTX PRO 6000 Blackwell Server Edition',\n"
              '          ]\n'
          )
          if s.count(old) != 1:
              raise SystemExit(f'MAX_ATTEMPTS anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '          def create_pod(exclude_datacenters):\n              create_body = {\n'
          new = (
              '          def create_pod(excluded_gpu_types):\n'
              '              gpu_type_ids = [gpu for gpu in GPU_TYPES_WIDE if gpu not in excluded_gpu_types]\n'
              "              if not gpu_type_ids:\n"
              "                  raise RuntimeError('all candidate GPU types have been excluded by failed preflights')\n"
              "              print(f'Eligible GPU types this attempt: {gpu_type_ids}')\n"
              '              create_body = {\n'
          )
          if s.count(old) != 1:
              raise SystemExit(f'create_pod anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          pattern = re.compile(
              r"                  # GPU order/config deliberately UNCHANGED this cycle -- only\n"
              r"                  # datacenter steering is under test, to isolate which lever\n"
              r"                  # \(if either\) actually escapes the sticky-host allocator\.\n"
              r"                  'gpuTypeIds': \[\n"
              r"(?:                      .*\n)+?"
              r"                  \],\n"
              r"                  'gpuTypePriority': 'custom',\n"
          )
          s, n = pattern.subn(
              "                  'gpuTypeIds': gpu_type_ids,\n                  'gpuTypePriority': 'custom',\n",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'GPU list replacement count={n}')

          if s.count('          excluded_datacenters = set()\n') != 1:
              raise SystemExit('excluded_datacenters init anchor mismatch')
          s = s.replace('          excluded_datacenters = set()\n', '          excluded_gpu_types = set()\n', 1)

          if s.count('                  pod_id = create_pod(excluded_datacenters)\n') != 1:
              raise SystemExit('create_pod call anchor mismatch')
          s = s.replace('                  pod_id = create_pod(excluded_datacenters)\n', '                  pod_id = create_pod(excluded_gpu_types)\n', 1)

          old = (
              "                  print(f'::error::Attempt {attempt}: pod create failed: {exc}')\n"
              "                  summary_lines.append(f'attempt={attempt} pod_id=none result=CREATE_FAILED error={exc}')\n"
              '                  continue\n'
          )
          new = (
              "                  print(f'::error::Attempt {attempt}: pod create failed: {exc}')\n"
              "                  summary_lines.append(f'attempt={attempt} pod_id=none result=CREATE_FAILED error={exc}')\n"
              '                  if attempt < MAX_ATTEMPTS:\n'
              '                      delay = min(15 * attempt, 45)\n'
              "                      print(f'No capacity matched; waiting {delay}s before retrying the wide GPU pool.')\n"
              '                      time.sleep(delay)\n'
              '                  continue\n'
          )
          if s.count(old) != 1:
              raise SystemExit(f'create failure block count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = (
              "                  print(f'Attempt {attempt}: NVDEC preflight FAILED on pod {pod_id} '\n"
              "                        f'(driver {driver_version}, machine {machine_id}, datacenter {data_center_id}, '\n"
              "                        f'host {ip}) -- deleting and steering next attempt away from this datacenter.')\n"
              "                  if data_center_id != 'unknown':\n"
              '                      excluded_datacenters.add(data_center_id)\n'
              '                  delete_pod(pod_id)\n'
          )
          new = (
              "                  print(f'Attempt {attempt}: NVDEC preflight FAILED on pod {pod_id} '\n"
              "                        f'(driver {driver_version}, machine {machine_id}, datacenter {data_center_id}, '\n"
              "                        f'host {ip}) -- deleting and excluding GPU type {gpu_type} for remaining attempts.')\n"
              "                  if gpu_type != 'unknown':\n"
              '                      excluded_gpu_types.add(gpu_type)\n'
              '                      remaining = [gpu for gpu in GPU_TYPES_WIDE if gpu not in excluded_gpu_types]\n'
              "                      print(f'Excluded GPU types: {sorted(excluded_gpu_types)}; remaining candidates: {remaining}')\n"
              '                  delete_pod(pod_id)\n'
              '                  if attempt < MAX_ATTEMPTS:\n'
              '                      time.sleep(10)\n'
          )
          if s.count(old) != 1:
              raise SystemExit(f'preflight failure block count={s.count(old)}')
          s = s.replace(old, new, 1)

          if 'excluded_datacenters' in s:
              raise SystemExit('stale excluded_datacenters reference remains')
          if s.count("'NVIDIA L40S'") != 1 or s.count("'NVIDIA GeForce RTX 5090'") != 1:
              raise SystemExit('wide GPU list verification failed')
          p.write_text(s)
          PY

          git diff --check
          grep -q 'MAX_ATTEMPTS = 6' .github/workflows/oev-runpod-sample-baseline.yml
          grep -q 'excluded_gpu_types.add(gpu_type)' .github/workflows/oev-runpod-sample-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/oev-runpod-sample-baseline.yml
          git commit -m 'test(oev): broaden EU GPU fallback for stride-3 run'
          git push origin HEAD:${{ github.ref_name }}

      - name: Dispatch same v4 stride-3 sample on EU-RO-1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload=$(cat <<JSON
          {
            "ref": "${REF}",
            "inputs": {
              "datacenter": "EU-RO-1",
              "sample_id": "sample_01",
              "duration_s": "180",
              "sample_set_id": "GX010197-seed1384188843",
              "model_variant": "yolo26m",
              "lookahead": "1.5",
              "cluster_alpha_override": "0.08"
            }
          }
          JSON
          )
          code=$(curl -sS -o /tmp/dispatch-body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/oev-runpod-sample-baseline.yml/dispatches" \
            -d "$payload")
          cat /tmp/dispatch-body.txt || true
          test "$code" = '204' || { echo "::error::workflow dispatch returned HTTP $code"; exit 1; }
          echo 'Dispatched broadened EU v4 stride-3 test.'
