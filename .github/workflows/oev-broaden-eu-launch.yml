name: OEV — one-shot broaden EU stride-3 launcher

on:
  push:
    branches:
      - experiment/lookahead-ball-containment-01

permissions:
  actions: write
  contents: read

jobs:
  patch-and-dispatch:
    if: github.event.head_commit.message == 'launch-v4-stride3-eu-broaden'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Broaden pinned-EU allocator and avoid repeated bad GPU type
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/oev-runpod-sample-baseline.yml')
          s = p.read_text()
          original = s

          s = s.replace(
              'Launch RunPod GPU pod (NVDEC preflight retry, max 3 attempts, pinned datacenter)',
              'Launch RunPod GPU pod (NVDEC preflight retry, max 6 attempts, pinned datacenter, GPU failover)',
              1,
          )

          old = "          MAX_ATTEMPTS = 3\n"
          new = """          MAX_ATTEMPTS = 6
          # Same wide GPU fallback pool already used by the production runtime allocator.
          # Keep the cheap/common types first; later types only win when earlier ones are unavailable.
          GPU_TYPES_WIDE = [
              'NVIDIA GeForce RTX 4090',
              'NVIDIA RTX A5000',
              'NVIDIA GeForce RTX 3090',
              'NVIDIA L4',
              'NVIDIA L40S',
              'NVIDIA GeForce RTX 5090',
              'NVIDIA RTX 2000 Ada Generation',
              'NVIDIA RTX PRO 6000 Blackwell Server Edition',
          ]
"""
          if s.count(old) != 1:
              raise SystemExit(f'MAX_ATTEMPTS anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = "          def create_pod(exclude_datacenters):\n              create_body = {\n"
          new = """          def create_pod(excluded_gpu_types):
              gpu_type_ids = [gpu for gpu in GPU_TYPES_WIDE if gpu not in excluded_gpu_types]
              if not gpu_type_ids:
                  raise RuntimeError('all candidate GPU types have been excluded by failed preflights')
              print(f'Eligible GPU types this attempt: {gpu_type_ids}')
              create_body = {
"""
          if s.count(old) != 1:
              raise SystemExit(f'create_pod anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          pattern = re.compile(
              r"                  # GPU order/config deliberately UNCHANGED this cycle -- only\n"
              r"                  # datacenter steering is under test, to isolate which lever\n"
              r"                  # \(if either\) actually escapes the sticky-host allocator\.\n"
              r"                  'gpuTypeIds': \[\n"
              r"(?:                      .*\n)+?"
              r"                  \],\n"
              r"                  'gpuTypePriority': 'custom',\n"
          )
          s, n = pattern.subn(
              "                  'gpuTypeIds': gpu_type_ids,\n                  'gpuTypePriority': 'custom',\n",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'GPU list replacement count={n}')

          s = s.replace('          excluded_datacenters = set()\n', '          excluded_gpu_types = set()\n', 1)
          s = s.replace('                  pod_id = create_pod(excluded_datacenters)\n', '                  pod_id = create_pod(excluded_gpu_types)\n', 1)

          old = """                  print(f'::error::Attempt {attempt}: pod create failed: {exc}')
                  summary_lines.append(f'attempt={attempt} pod_id=none result=CREATE_FAILED error={exc}')
                  continue
"""
          new = """                  print(f'::error::Attempt {attempt}: pod create failed: {exc}')
                  summary_lines.append(f'attempt={attempt} pod_id=none result=CREATE_FAILED error={exc}')
                  if attempt < MAX_ATTEMPTS:
                      delay = min(15 * attempt, 45)
                      print(f'No capacity matched; waiting {delay}s before retrying the wide GPU pool.')
                      time.sleep(delay)
                  continue
"""
          if s.count(old) != 1:
              raise SystemExit(f'create failure block count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = """                  print(f'Attempt {attempt}: NVDEC preflight FAILED on pod {pod_id} '
                        f'(driver {driver_version}, machine {machine_id}, datacenter {data_center_id}, '
                        f'host {ip}) -- deleting and steering next attempt away from this datacenter.')
                  if data_center_id != 'unknown':
                      excluded_datacenters.add(data_center_id)
                  delete_pod(pod_id)
"""
          new = """                  print(f'Attempt {attempt}: NVDEC preflight FAILED on pod {pod_id} '
                        f'(driver {driver_version}, machine {machine_id}, datacenter {data_center_id}, '
                        f'host {ip}) -- deleting and excluding GPU type {gpu_type} for remaining attempts.')
                  if gpu_type != 'unknown':
                      excluded_gpu_types.add(gpu_type)
                      remaining = [gpu for gpu in GPU_TYPES_WIDE if gpu not in excluded_gpu_types]
                      print(f'Excluded GPU types: {sorted(excluded_gpu_types)}; remaining candidates: {remaining}')
                  delete_pod(pod_id)
                  if attempt < MAX_ATTEMPTS:
                      time.sleep(10)
"""
          if s.count(old) != 1:
              raise SystemExit(f'preflight failure block count={s.count(old)}')
          s = s.replace(old, new, 1)

          if s == original:
              raise SystemExit('allocator patch made no changes')
          if 'excluded_datacenters' in s:
              raise SystemExit('stale excluded_datacenters reference remains')
          if s.count("'NVIDIA L40S'") != 1 or s.count("'NVIDIA GeForce RTX 5090'") != 1:
              raise SystemExit('wide GPU list verification failed')
          p.write_text(s)
          PY

          git diff --check
          grep -q 'MAX_ATTEMPTS = 6' .github/workflows/oev-runpod-sample-baseline.yml
          grep -q 'excluded_gpu_types.add(gpu_type)' .github/workflows/oev-runpod-sample-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/oev-runpod-sample-baseline.yml
          git commit -m 'test(oev): broaden EU GPU fallback for stride-3 run'
          git push origin HEAD:${{ github.ref_name }}

      - name: Dispatch same v4 stride-3 sample on EU-RO-1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload=$(cat <<JSON
          {
            "ref": "${REF}",
            "inputs": {
              "datacenter": "EU-RO-1",
              "sample_id": "sample_01",
              "duration_s": "180",
              "sample_set_id": "GX010197-seed1384188843",
              "model_variant": "yolo26m",
              "lookahead": "1.5",
              "cluster_alpha_override": "0.08"
            }
          }
          JSON
          )
          code=$(curl -sS -o /tmp/dispatch-body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/oev-runpod-sample-baseline.yml/dispatches" \
            -d "$payload")
          cat /tmp/dispatch-body.txt || true
          test "$code" = '204' || { echo "::error::workflow dispatch returned HTTP $code"; exit 1; }
          echo 'Dispatched broadened EU v4 stride-3 test.'
