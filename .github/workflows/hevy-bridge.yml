name: Hevy API Bridge

on:
  push:
    branches:
      - feature/hevy-api-bridge
    paths:
      - hevy/request.json
      - .github/workflows/hevy-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hevy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call Hevy API
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          from pathlib import Path

          api_key = os.environ.get("HEVY_API_KEY")
          if not api_key:
              raise SystemExit("Missing repository secret HEVY_API_KEY")

          req = json.loads(Path("hevy/request.json").read_text())
          op = req.get("operation")
          base = "https://api.hevyapp.com"

          if op == "list_routines":
              page = int(req.get("page", 1))
              page_size = min(int(req.get("page_size", 10)), 10)
              method = "GET"
              path = f"/v1/routines?page={page}&pageSize={page_size}"
              body = None
          elif op == "get_routine":
              routine_id = req["routine_id"]
              method = "GET"
              path = f"/v1/routines/{urllib.parse.quote(routine_id, safe='')}"
              body = None
          elif op == "list_exercise_templates":
              page = int(req.get("page", 1))
              page_size = min(int(req.get("page_size", 100)), 100)
              method = "GET"
              path = f"/v1/exercise_templates?page={page}&pageSize={page_size}"
              body = None
          elif op == "update_routine":
              routine_id = req["routine_id"]
              payload = req["payload"]
              method = "PUT"
              path = f"/v1/routines/{urllib.parse.quote(routine_id, safe='')}"
              body = json.dumps(payload).encode("utf-8")
          else:
              raise SystemExit(f"Unsupported operation: {op!r}")

          request = urllib.request.Request(
              base + path,
              data=body,
              method=method,
              headers={
                  "api-key": api_key,
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "ffa-automations-hevy-bridge/1.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read().decode("utf-8")
                  status = response.status
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", errors="replace")
              status = exc.code

          try:
              data = json.loads(raw) if raw else None
          except json.JSONDecodeError:
              data = raw

          result = {
              "operation": op,
              "status": status,
              "response": data,
          }
          Path("hevy/response.json").write_text(json.dumps(result, indent=2))
          print(f"Hevy API status: {status}")
          if status < 200 or status >= 300:
              raise SystemExit(1)
          PY

      - name: Upload response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hevy-response
          path: hevy/response.json
          if-no-files-found: warn
