name: Hevy API Bridge

on:
  push:
    branches:
      - feature/hevy-api-bridge
    paths:
      - hevy/request.json
      - .github/workflows/hevy-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hevy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call Hevy API
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          api_key=os.environ.get('HEVY_API_KEY')
          if not api_key: raise SystemExit('Missing repository secret HEVY_API_KEY')
          req=json.loads(Path('hevy/request.json').read_text()); op=req.get('operation'); base='https://api.hevyapp.com'
          def call(method,path,payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(base+path,data=body,method=method,headers={'api-key':api_key,'Accept':'application/json','Content-Type':'application/json','User-Agent':'ffa-automations-hevy-bridge/1.4'})
              try:
                  with urllib.request.urlopen(r,timeout=30) as x: raw=x.read().decode(); status=x.status
              except urllib.error.HTTPError as e: raw=e.read().decode(errors='replace'); status=e.code
              try: data=json.loads(raw) if raw else None
              except json.JSONDecodeError: data=raw
              return status,data
          if op=='list_routines':
              status,data=call('GET',f"/v1/routines?page={int(req.get('page',1))}&pageSize={min(int(req.get('page_size',10)),10)}")
          elif op=='get_routine':
              status,data=call('GET','/v1/routines/'+urllib.parse.quote(req['routine_id'],safe=''))
          elif op=='list_exercise_templates':
              status,data=call('GET',f"/v1/exercise_templates?page={int(req.get('page',1))}&pageSize={min(int(req.get('page_size',100)),100)}")
          elif op=='update_routine':
              payload=req['payload']; payload=payload if 'routine' in payload else {'routine':payload}
              status,data=call('PUT','/v1/routines/'+urllib.parse.quote(req['routine_id'],safe=''),payload)
          elif op in ('ensure_mobility_routine','ensure_routine'):
              templates=[]; page=1
              while True:
                  s,d=call('GET',f'/v1/exercise_templates?page={page}&pageSize=100')
                  if not 200<=s<300: status,data=s,d; break
                  templates.extend(d.get('exercise_templates',[]))
                  if page>=int(d.get('page_count',page)): break
                  page+=1
              else: pass
              if 'status' not in locals() or 200<=status<300:
                  by_title={t.get('title','').strip().lower():t for t in templates}; created=[]; resolved={}
                  failed=False
                  for spec in req['exercise_templates']:
                      key=spec['title'].strip().lower(); tmpl=by_title.get(key)
                      if tmpl is None:
                          s,d=call('POST','/v1/exercise_templates',{'exercise':{'title':spec['title'],'exercise_type':spec['exercise_type'],'equipment_category':spec.get('equipment_category','none'),'muscle_group':spec.get('muscle_group','other'),'other_muscles':spec.get('other_muscles',[])}})
                          if not 200<=s<300: status,data=s,{'failed_exercise':spec['title'],'response':d,'created':created}; failed=True; break
                          if isinstance(d,str): tmpl={'id':d,'title':spec['title']}
                          else:
                              tmpl=d.get('exercise_template') or d.get('exercise') or d
                              if 'id' not in tmpl and 'exercise_template_id' in tmpl: tmpl={'id':tmpl['exercise_template_id'],'title':spec['title']}
                          created.append(tmpl); by_title[key]=tmpl
                      resolved[spec['key']]=tmpl['id']
                  if not failed:
                      exercises=[]
                      for ex in req['routine']['exercises']:
                          sets=[{'type':st.get('type','normal'),'weight_kg':st.get('weight_kg'),'reps':st.get('reps'),'distance_meters':st.get('distance_meters'),'duration_seconds':st.get('duration_seconds'),'custom_metric':st.get('custom_metric')} for st in ex['sets']]
                          exercises.append({'exercise_template_id':resolved[ex['template_key']],'superset_id':ex.get('superset_id'),'rest_seconds':ex.get('rest_seconds',30),'notes':ex.get('notes',''),'sets':sets})
                      rp={'routine':{'title':req['routine']['title'],'notes':req['routine'].get('notes',''),'exercises':exercises}}
                      if req.get('routine_id'):
                          status,updated=call('PUT','/v1/routines/'+urllib.parse.quote(req['routine_id'],safe=''),rp)
                      else:
                          status,updated=call('POST','/v1/routines',rp)
                      data={'created_exercises':created,'resolved_template_ids':resolved,'routine':updated}
          else: raise SystemExit(f'Unsupported operation: {op!r}')
          Path('hevy/response.json').write_text(json.dumps({'operation':op,'status':status,'response':data},indent=2)); print(f'Hevy API status: {status}')
          if not 200<=status<300: raise SystemExit(1)
          PY

      - name: Upload response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hevy-response
          path: hevy/response.json
          if-no-files-found: warn
