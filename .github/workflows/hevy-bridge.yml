name: Hevy API Bridge

on:
  push:
    branches:
      - feature/hevy-api-bridge
    paths:
      - hevy/request.json
      - .github/workflows/hevy-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hevy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call Hevy API
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          from pathlib import Path

          api_key = os.environ.get("HEVY_API_KEY")
          if not api_key:
              raise SystemExit("Missing repository secret HEVY_API_KEY")

          req = json.loads(Path("hevy/request.json").read_text())
          op = req.get("operation")
          base = "https://api.hevyapp.com"

          def call(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  base + path,
                  data=body,
                  method=method,
                  headers={
                      "api-key": api_key,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "ffa-automations-hevy-bridge/1.3",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                      status = response.status
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  status = exc.code
              try:
                  data = json.loads(raw) if raw else None
              except json.JSONDecodeError:
                  data = raw
              return status, data

          if op == "list_routines":
              page = int(req.get("page", 1))
              page_size = min(int(req.get("page_size", 10)), 10)
              status, data = call("GET", f"/v1/routines?page={page}&pageSize={page_size}")

          elif op == "get_routine":
              routine_id = urllib.parse.quote(req["routine_id"], safe="")
              status, data = call("GET", f"/v1/routines/{routine_id}")

          elif op == "list_exercise_templates":
              page = int(req.get("page", 1))
              page_size = min(int(req.get("page_size", 100)), 100)
              status, data = call("GET", f"/v1/exercise_templates?page={page}&pageSize={page_size}")

          elif op == "update_routine":
              routine_id = urllib.parse.quote(req["routine_id"], safe="")
              payload = req["payload"]
              if "routine" not in payload:
                  payload = {"routine": payload}
              status, data = call("PUT", f"/v1/routines/{routine_id}", payload)

          elif op == "ensure_mobility_routine":
              templates = []
              page = 1
              while True:
                  s, d = call("GET", f"/v1/exercise_templates?page={page}&pageSize=100")
                  if s < 200 or s >= 300:
                      status, data = s, d
                      break
                  templates.extend(d.get("exercise_templates", []))
                  if page >= int(d.get("page_count", page)):
                      break
                  page += 1

              if 'status' not in locals() or 200 <= status < 300:
                  by_title = {t.get("title", "").strip().lower(): t for t in templates}
                  created = []
                  resolved = {}
                  for spec in req["exercise_templates"]:
                      key = spec["title"].strip().lower()
                      tmpl = by_title.get(key)
                      if tmpl is None:
                          payload = {
                              "exercise": {
                                  "title": spec["title"],
                                  "exercise_type": spec["exercise_type"],
                                  "equipment_category": spec.get("equipment_category", "none"),
                                  "muscle_group": spec.get("muscle_group", "other"),
                                  "other_muscles": spec.get("other_muscles", []),
                              }
                          }
                          s, d = call("POST", "/v1/exercise_templates", payload)
                          if s < 200 or s >= 300:
                              status, data = s, {"failed_exercise": spec["title"], "response": d, "created": created}
                              break
                          if isinstance(d, str):
                              tmpl = {"id": d, "title": spec["title"]}
                          elif isinstance(d, dict):
                              tmpl = d.get("exercise_template") or d.get("exercise") or d
                              if "id" not in tmpl and "exercise_template_id" in tmpl:
                                  tmpl = {"id": tmpl["exercise_template_id"], "title": spec["title"]}
                          else:
                              raise TypeError(f"Unexpected create exercise response: {type(d).__name__}")
                          created.append(tmpl)
                          by_title[key] = tmpl
                      resolved[spec["key"]] = tmpl["id"]
                  else:
                      routine_exercises = []
                      for ex in req["routine"]["exercises"]:
                          sets = []
                          for st in ex["sets"]:
                              sets.append({
                                  "type": st.get("type", "normal"),
                                  "weight_kg": st.get("weight_kg"),
                                  "reps": st.get("reps"),
                                  "distance_meters": st.get("distance_meters"),
                                  "duration_seconds": st.get("duration_seconds"),
                                  "custom_metric": st.get("custom_metric"),
                              })
                          routine_exercises.append({
                              "exercise_template_id": resolved[ex["template_key"]],
                              "superset_id": ex.get("superset_id"),
                              "rest_seconds": ex.get("rest_seconds", 15),
                              "notes": ex.get("notes", ""),
                              "sets": sets,
                          })

                      routine_payload = {
                          "routine": {
                              "title": req["routine"]["title"],
                              "notes": req["routine"].get("notes", ""),
                              "exercises": routine_exercises,
                          }
                      }
                      routine_id = urllib.parse.quote(req["routine_id"], safe="")
                      status, updated = call("PUT", f"/v1/routines/{routine_id}", routine_payload)
                      data = {
                          "created_exercises": created,
                          "resolved_template_ids": resolved,
                          "routine": updated,
                      }

          else:
              raise SystemExit(f"Unsupported operation: {op!r}")

          result = {"operation": op, "status": status, "response": data}
          Path("hevy/response.json").write_text(json.dumps(result, indent=2))
          print(f"Hevy API status: {status}")
          if status < 200 or status >= 300:
              raise SystemExit(1)
          PY

      - name: Upload response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hevy-response
          path: hevy/response.json
          if-no-files-found: warn
