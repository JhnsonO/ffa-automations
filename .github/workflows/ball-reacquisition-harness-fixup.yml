name: Ball reacquisition harness fixup

on:
  push:
    branches: [experiment/ball-reacquisition-layer-01]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ball-reacq-harness]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experiment/ball-reacquisition-layer-01
          token: ${{ secrets.GH_PAT }}
      - name: Apply treatment harness patch
        run: python3 tools/patch_ball_reacquisition_harness.py
      - name: Verify treatment invariants
        run: |
          grep -F "EXPECTED_RECO_SHA='160c1aac8a59f83b9c6ccdfcc57b69bd8a598432'" .github/workflows/oev-runpod-sample-baseline.yml
          grep -F 'reset --hard 160c1aac8a59f83b9c6ccdfcc57b69bd8a598432' runpod_bootstrap.sh
          grep -F -- '--high-res-ball-recovery' runpod_sample_baseline_yolo26_remote.sh
          ! grep -F -- '--frame-stride 3' runpod_sample_baseline_yolo26_remote.sh
          git diff --check
      - name: Commit treatment harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/oev-runpod-sample-baseline.yml runpod_bootstrap.sh runpod_sample_baseline_yolo26_remote.sh
          git commit -m "test: pin stride1 ball reacquisition treatment [ball-reacq-harness]"
          git push origin HEAD:experiment/ball-reacquisition-layer-01
