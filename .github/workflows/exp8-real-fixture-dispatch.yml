name: EXP8 — dispatch real allocation-size fixture

on:
  push:
    branches:
      - diag/zc-exp8-image-alloc-size
    paths:
      - '.github/workflows/exp8-real-fixture-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact Avenue-2 fixture replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/JhnsonO/ffa-automations/actions/workflows/oev-zero-copy-diag.yml/dispatches \
            -d '{"ref":"diag/zc-exp8-image-alloc-size"}'
          echo 'EXP8 real fixture dispatched; its own fresh cargo build is the compile gate.'
