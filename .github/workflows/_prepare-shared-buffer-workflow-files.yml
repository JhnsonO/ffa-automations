name: OEV — Prepare shared-buffer workflow files (temporary)

on:
  push:
    branches:
      - rollout/shared-buffer-main
    paths:
      - '.github/workflows/_prepare-shared-buffer-workflow-files.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rollout/shared-buffer-main
      - name: Update production Reco pins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='53fe10f548d5767ad94ef66aeaedf2d8c7161f27'
          new='f27cbb6d0d65fcf9a11fb4d82d119ae214695318'
          files=[
            Path('.github/workflows/oev-populate-volume.yml'),
            Path('.github/workflows/oev-runpod-followcam.yml'),
            Path('.github/workflows/oev-runpod-sample-baseline.yml'),
            Path('.github/workflows/oev-runpod-followcam-ab-yolo26.yml'),
          ]
          total=0
          for p in files:
            s=p.read_text(); n=s.count(old)
            if n != 1: raise SystemExit(f'{p}: expected one old pin, found {n}')
            p.write_text(s.replace(old,new)); total+=n
          print(f'updated {total} production Reco pins')
          PY
      - name: Upload workflow files
        uses: actions/upload-artifact@v4
        with:
          name: shared-buffer-workflow-files-${{ github.run_id }}
          path: |
            .github/workflows/oev-populate-volume.yml
            .github/workflows/oev-runpod-followcam.yml
            .github/workflows/oev-runpod-sample-baseline.yml
            .github/workflows/oev-runpod-followcam-ab-yolo26.yml
          include-hidden-files: true
          retention-days: 7
