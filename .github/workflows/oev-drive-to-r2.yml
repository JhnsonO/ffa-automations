name: OEV — Copy source videos Drive -> R2 (resumable)

# OEV-006: Drive rations downloads of the multi-GB GoPro sources, which
# blocked P1. This copies each source once to R2 (oev/sources/<name>),
# single connection, in ranged parts streamed into a multipart upload.
# Stops on the first Drive 403/429 without retrying; progress is kept in R2
# so a re-run resumes. No GPU.

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Space-separated NAME=DRIVE_ID pairs (default: the four OEV-006 sources)'
        required: false
        default: 'GX010197.MP4=1WaXjRq-QSwKseCZM7X_GJgZVqU3LffPE GX010173.MP4=1iUJe84rQUkyFBo6BBZnhNBWQQp6LMSay GX010175.MP4=1_b4_ojm8iqyMNFtd6qYdfQdke253FQqI GX010198.MP4=10Wui460oIqnMMR-5U7EzKuCHBkYMgIDB'
        type: string
      part_mb:
        description: 'Part size in MB'
        required: false
        default: '256'
        type: string

permissions:
  contents: read

concurrency:
  group: oev-drive-to-r2
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: pip install -q boto3
      - name: Drive access token
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request as req
          t = json.loads(os.environ['YOUTUBE_TOKEN']); c = json.loads(os.environ['YOUTUBE_CREDENTIALS'])
          body = json.dumps({'client_id': t.get('client_id') or c['installed']['client_id'],
                             'client_secret': t.get('client_secret') or c['installed']['client_secret'],
                             'refresh_token': t['refresh_token'], 'grant_type': 'refresh_token'}).encode()
          r = json.loads(req.urlopen(req.Request('https://oauth2.googleapis.com/token', data=body,
                         headers={'Content-Type': 'application/json'}, method='POST')).read())
          tok = r['access_token']
          print(f'::add-mask::{tok}')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'DRIVE_ACCESS_TOKEN={tok}\n')
          PY
      - name: Copy (resumable, stops on Drive refusal)
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          FILES: ${{ inputs.files }}
          PART_MB: ${{ inputs.part_mb }}
        run: |
          args=()
          for f in $FILES; do args+=(--file "$f"); done
          python3 -u scripts/oev_drive_to_r2.py "${args[@]}" --part-mb "$PART_MB" --budget-min 330
