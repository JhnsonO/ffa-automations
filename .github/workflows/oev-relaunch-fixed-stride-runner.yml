name: OEV — one-shot fixed stride runner relaunch

on:
  push:
    branches:
      - experiment/lookahead-ball-containment-01

permissions:
  actions: write
  contents: read

jobs:
  validate-and-dispatch:
    if: github.event.head_commit.message == 'launch-v4-stride3-eu-fixed-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate final stride insertion before spending on RunPod
        run: |
          set -euo pipefail
          bash -n runpod_sample_baseline_yolo26_remote.sh
          V3_SHA='c91314eaca8e2cbb0b6813f6e8204e4da23f408c'
          BASE_SHA='aad4aedcf8aa6f949c4b80bbbab5580dd322d24a'
          curl -fsSL "https://raw.githubusercontent.com/JhnsonO/ffa-automations/${V3_SHA}/runpod_sample_baseline_yolo26_remote.sh" -o /tmp/v3.sh
          curl -fsSL "https://raw.githubusercontent.com/JhnsonO/ffa-automations/${BASE_SHA}/runpod_sample_baseline_yolo26_remote.sh" -o /tmp/base.sh
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path('runpod_sample_baseline_yolo26_remote.sh').read_text()
          v3 = Path('/tmp/v3.sh').read_text()
          base = Path('/tmp/base.sh').read_text()

          wrapper_anchor = 'run_marker = \'"$BASE_SCRIPT"\\n\\n\' + metrics_marker'
          assert wrapper.count(wrapper_anchor) == 1, f'unique deferred execution anchor count={wrapper.count(wrapper_anchor)}'

          metrics_marker = "python3 - <<'PY' 2>&1 | tee containment_metrics.log\n"
          run_marker = '"$BASE_SCRIPT"\n\n' + metrics_marker
          assert v3.count(run_marker) == 1, f'v3 base execution -> metrics boundary count={v3.count(run_marker)}'

          old = "  --detection-interval 1\n  --events events.jsonl\n"
          new = "  --detection-interval 1\n  --frame-stride 3\n  --events events.jsonl\n"
          assert base.count(old) == 1, f'final base cadence anchor count={base.count(old)}'
          patched = base.replace(old, new, 1)
          assert patched.count('--frame-stride 3') == 1
          assert new in patched
          print('PASS: unique v3 execution boundary resolves; final Reco STITCH_ARGS contains frame-stride 3 exactly once')
          PY

      - name: Dispatch same 180s v4 stride-3 test on broadened EU allocator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload=$(cat <<JSON
          {
            "ref": "${REF}",
            "inputs": {
              "datacenter": "EU-RO-1",
              "sample_id": "sample_01",
              "duration_s": "180",
              "sample_set_id": "GX010197-seed1384188843",
              "model_variant": "yolo26m",
              "lookahead": "1.5",
              "cluster_alpha_override": "0.08"
            }
          }
          JSON
          )
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/oev-runpod-sample-baseline.yml/dispatches" \
            -d "$payload")
          cat /tmp/body.txt || true
          test "$code" = '204'
          echo 'Dispatched fixed-runner EU stride-3 test.'
