name: OEV — one-shot dispatch stride3 samples 02-05

on:
  push:
    branches:
      - experiment/lookahead-ball-containment-01

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'launch stride3 samples 02-05'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch remaining 180s stride3 samples
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for SAMPLE in sample_02 sample_03 sample_04 sample_05; do
            payload=$(cat <<JSON
          {
            "ref": "${REF}",
            "inputs": {
              "datacenter": "EU-RO-1",
              "sample_id": "${SAMPLE}",
              "duration_s": "180",
              "sample_set_id": "GX010197-seed1384188843",
              "model_variant": "yolo26m",
              "lookahead": "1.5",
              "cluster_alpha_override": "0.08"
            }
          }
          JSON
            )
            code=$(curl -sS -o "/tmp/${SAMPLE}.body" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/oev-runpod-sample-baseline.yml/dispatches" \
              -d "$payload")
            cat "/tmp/${SAMPLE}.body" || true
            test "$code" = '204'
            echo "Dispatched ${SAMPLE} 180s stride3."
            sleep 3
          done
