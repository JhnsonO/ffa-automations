name: EXP7 — dispatch hardware diagnostic

on:
  push:
    branches:
      - diag/zc-exp7-compile-proof
    paths:
      - '.github/workflows/exp7-compile-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing zero-copy RunPod workflow on EXP7 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/JhnsonO/ffa-automations/actions/workflows/oev-zero-copy-diag.yml/dispatches \
            -d '{"ref":"diag/zc-exp7-compile-proof"}'
          echo "Dispatched oev-zero-copy-diag.yml on diag/zc-exp7-compile-proof"
