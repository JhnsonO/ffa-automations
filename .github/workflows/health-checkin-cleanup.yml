name: Johnson OS check-in cleanup

on:
  push:
    branches:
      - feature/johnson-os-github-bridge
    paths:
      - health-checkin/ack.json
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: johnson-os-checkin-cleanup
  cancel-in-progress: false

jobs:
  delete-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out acknowledgement
        uses: actions/checkout@v4

      - name: Validate acknowledgement
        id: ack
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const value = require('./health-checkin/ack.json');
          if (value.operation === 'idle') {
            console.log('delete=false');
            console.log('artifact_id=0');
          } else {
            if (value.operation !== 'delete_artifact') throw new Error('unsupported ack.operation');
            if (!Number.isSafeInteger(value.artifact_id) || value.artifact_id <= 0) throw new Error('ack.artifact_id must be a positive integer');
            console.log('delete=true');
            console.log(`artifact_id=${value.artifact_id}`);
          }
          NODE

      - name: Delete encrypted artifact
        if: steps.ack.outputs.delete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.ack.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
