name: Johnson OS check-in cleanup

on:
  push:
    branches:
      - feature/johnson-os-github-bridge
    paths:
      - health-checkin/ack.json
      - .github/workflows/health-checkin-cleanup.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: johnson-os-checkin-cleanup
  cancel-in-progress: false

jobs:
  delete-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out request
        uses: actions/checkout@v4

      - name: Validate acknowledgement
        id: ack
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(node -e "
            const value = require('./health-checkin/ack.json');
            if (value.operation !== 'delete_artifact') throw new Error('ack.operation must be delete_artifact');
            if (!Number.isSafeInteger(value.artifact_id) || value.artifact_id <= 0) throw new Error('ack.artifact_id must be a positive integer');
            process.stdout.write(String(value.artifact_id));
          ")"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Delete encrypted artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.ack.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
