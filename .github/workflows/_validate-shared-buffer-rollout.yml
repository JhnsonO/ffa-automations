name: OEV — Validate shared-buffer production rollout (temporary)

on:
  push:
    branches:
      - rollout/shared-buffer-main
    paths:
      - '.github/workflows/_validate-shared-buffer-rollout.yml'

permissions:
  actions: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ROLLOUT_BRANCH: rollout/shared-buffer-main
      RECO_SHA: f27cbb6d0d65fcf9a11fb4d82d119ae214695318
      VOLUME_MAP_JSON: ${{ vars.OEV_NETWORK_VOLUME_MAP }}
    steps:
      - name: Dispatch EU-RO-1 runtime refresh and production canary
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['ROLLOUT_BRANCH']
          api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def req(method,url,data=None):
              r=urllib.request.Request(url,data=(json.dumps(data).encode() if data is not None else None),method=method,headers=headers)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read(); return json.loads(raw) if raw else {}
          def runs(workflow):
              q=urllib.parse.urlencode({'branch':branch,'event':'workflow_dispatch','per_page':50})
              return req('GET',f'{api}/actions/workflows/{workflow}/runs?{q}')['workflow_runs']
          def dispatch(workflow,inputs):
              before={r['id'] for r in runs(workflow)}
              req('POST',f'{api}/actions/workflows/{workflow}/dispatches',{'ref':branch,'inputs':inputs})
              for _ in range(60):
                  time.sleep(2)
                  fresh=[r for r in runs(workflow) if r['id'] not in before]
                  if fresh:
                      r=max(fresh,key=lambda x:x['id']); print(f'DISPATCHED {workflow} run={r["id"]} url={r["html_url"]}',flush=True); return r['id']
              raise RuntimeError(f'could not resolve dispatched run for {workflow}')
          def wait(rid,label,timeout=5400):
              end=time.time()+timeout
              last=None
              while time.time()<end:
                  r=req('GET',f'{api}/actions/runs/{rid}')
                  key=(r['status'],r.get('conclusion'))
                  if key != last:
                      print(f'{label}: run={rid} status={key[0]} conclusion={key[1]}',flush=True); last=key
                  if r['status']=='completed':
                      if r['conclusion']!='success': raise RuntimeError(f'{label} failed: {r["html_url"]}')
                      return r
                  time.sleep(10)
              raise TimeoutError(f'{label} timed out: {rid}')

          eu=dispatch('oev-populate-volume.yml',{
              'datacenter_id':'EU-RO-1','reco_sha':os.environ['RECO_SHA'],
              'reco_repo':'https://github.com/JhnsonO/video-stitcher','ultralytics_version':'8.4.118','force_rebuild':'false'})
          wait(eu,'EU-RO-1 populate')

          canary=dispatch('oev-runpod-sample-baseline.yml',{
              'datacenter':'EU-RO-1','sample_id':'sample_01','duration_s':'30',
              'sample_set_id':'GX010197-seed1384188843','model_variant':'yolo26m',
              'lookahead':'1.5','cluster_alpha_override':'0.05'})
          wait(canary,'EU-RO-1 production canary')

          result={'EU-RO-1':eu,'canary':canary}
          open('/tmp/rollout_runs.json','w').write(json.dumps(result,indent=2,sort_keys=True))
          print('EU_CANARY_PASS '+json.dumps(result,sort_keys=True),flush=True)
          PY

      - name: Refresh remaining mapped runtime volumes after canary
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          results=json.load(open('/tmp/rollout_runs.json'))
          volume_map=json.loads(os.environ['VOLUME_MAP_JSON'])
          dcs=[dc for dc in volume_map.keys() if dc!='EU-RO-1']
          print('CURRENT_VOLUME_MAP='+json.dumps(volume_map,sort_keys=True),flush=True)
          print('REMAINING_DCS='+json.dumps(dcs),flush=True)
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['ROLLOUT_BRANCH']; wf='oev-populate-volume.yml'
          api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def req(method,url,data=None):
              r=urllib.request.Request(url,data=(json.dumps(data).encode() if data is not None else None),method=method,headers=headers)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read(); return json.loads(raw) if raw else {}
          def list_runs():
              q=urllib.parse.urlencode({'branch':branch,'event':'workflow_dispatch','per_page':100})
              return req('GET',f'{api}/actions/workflows/{wf}/runs?{q}')['workflow_runs']
          used=set(results.values()); dispatched={}
          for dc in dcs:
              before={r['id'] for r in list_runs()}
              req('POST',f'{api}/actions/workflows/{wf}/dispatches',{'ref':branch,'inputs':{
                  'datacenter_id':dc,'reco_sha':os.environ['RECO_SHA'],
                  'reco_repo':'https://github.com/JhnsonO/video-stitcher','ultralytics_version':'8.4.118','force_rebuild':'false'}})
              rid=None
              for _ in range(60):
                  time.sleep(2)
                  fresh=[r for r in list_runs() if r['id'] not in before and r['id'] not in used]
                  if fresh: rid=max(fresh,key=lambda x:x['id'])['id']; break
              if rid is None: raise RuntimeError(f'could not resolve populate run for {dc}')
              used.add(rid); dispatched[dc]=rid
              print(f'DISPATCHED {dc} run={rid}',flush=True)

          pending=dict(dispatched); failures=[]; end=time.time()+5400
          while pending and time.time()<end:
              for dc,rid in list(pending.items()):
                  r=req('GET',f'{api}/actions/runs/{rid}')
                  if r['status']=='completed':
                      print(f'{dc}: run={rid} conclusion={r["conclusion"]} url={r["html_url"]}',flush=True)
                      if r['conclusion']!='success': failures.append((dc,rid,r['conclusion']))
                      del pending[dc]
              if pending: time.sleep(15)
          if pending: raise TimeoutError(f'populate runs timed out: {pending}')
          if failures: raise RuntimeError(f'volume refresh failures: {failures}')
          results.update(dispatched)
          open('/tmp/rollout_runs.json','w').write(json.dumps(results,indent=2,sort_keys=True))
          print('ROLLOUT_VOLUME_REFRESH_PASS '+json.dumps(results,sort_keys=True),flush=True)
          PY

      - name: Upload rollout run IDs
        uses: actions/upload-artifact@v4
        with:
          name: shared-buffer-rollout-validation-${{ github.run_id }}
          path: /tmp/rollout_runs.json
          retention-days: 30
