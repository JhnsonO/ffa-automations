name: OEV state sync 2026-08-16

on:
  push:
    paths:
      - '.github/workflows/oev-state-sync-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Update state document
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/ai-project-state.md')
          s = p.read_text()

          replacements = {
              "- **Frame-stride 3 — RESOLVED, in production (16 Aug).** Default fast-test mode for routine iteration (~2.7x faster stitch, full-rate output preserved). Stride 1 remains required for final sign-off/exact comparisons.":
              "- **Frame-stride 3 — OPEN REGRESSION after multi-sample visual validation (16 Aug).** The full-rate sparse-analysis implementation is live in code, but it is **not product-accepted as the default**: `sample_01` 180s looked mostly watchable with slight misses, while `sample_02` 180s showed severe lag/near-static camera behaviour for large portions. Treat stride 1 v4 as the accepted quality reference until the cadence/timebase issue is resolved.",

              "- **YOLO26m vs YOLOv8n — CONCLUDED, no adoption decision recorded.** YOLO26m roughly halves track-loss rate for ~7% more time/cost. Real verdict exists; deployment choice not yet made.":
              "- **YOLO26m vs YOLOv8n — YOLO26m preferred for current follow-cam experiments.** Prior A/B evidence showed roughly half the track-loss rate (~38 vs ~80 over 180s), higher confidence (~0.907 vs ~0.819), for ~7% more processing time. Keep visual product acceptance separate from detector metrics.",

              "- **RunPod GPU-pool observability — OPEN, unresolved after 3 fix attempts.** Handed off with debug budget exhausted; needs a fresh session.":
              "- **RunPod test allocator — HARDENED and proven; capacity/host compatibility remains variable.** Experiment path now excludes a GPU type after real NVDEC failure and falls through the widened pool; RTX 5090 is excluded from this experiment after a real Reco detector smoke failed with `cudaErrorNoKernelImageForDevice`. Capacity remains the main transient failure mode.",

              "- **sample_02 test matrix (all 3 durations) — not started.**":
              "- **Standardized 180s sample validation — ACTIVE.** `sample_01` through `sample_05` have been rendered on the current stride-3 experiment path; `sample_02` exposed a severe visual regression. A same-sample stride-1 v4 control (`31939820386`) completed successfully and is ready for visual A/B. Internal processing-time variance across samples is the next measurement task.",

              "**Status: COMPLETE and enabled for normal OEV testing.** The frame-stride ticket moved from an initial testing-only sparse-frame experiment to a production-safe full-rate implementation, was hardware-benchmarked, and is now live on both Reco and FFA `main`.":
              "**Historical rollout status — SUPERSEDED by the 16 Aug multi-sample regression entry near the top of this file.** The implementation is live on Reco/FFA `main`, but subsequent 180s visual validation showed that stride 3 does not yet preserve the accepted v4 camera behaviour on harder footage. Do not treat this section's original rollout verdict as current product acceptance."
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected state marker: {old[:100]}')
              s = s.replace(old, new, 1)

          marker = "---\n\n## OEV zero-copy option 2 — shared CUDA/Vulkan buffers integrated; real stereo render correct; A/B measured (15 Aug 2026)"
          if marker not in s:
              raise SystemExit('top insertion marker missing')

          section = r'''---

## Frame-stride 3 multi-sample validation — REGRESSION FOUND; stride-1 control rendered (16 Aug 2026)

**Current verdict:** stride 3 is **not accepted for product-quality follow-cam yet**, despite the earlier 30s speed benchmark and `sample_01` 180s looking reasonably watchable. Multi-sample testing exposed a severe camera-response regression on `sample_02`. The accepted quality reference remains the v4 stride-1 behaviour from run `31913398625` (YOLO26m, FOV 44°, lookahead 1.5s, `cluster_alpha=0.08`, v3 trajectory hysteresis + v4 micro-damping).

**Implementation that is being tested:** Reco `b2fc622f4b07dfa0c43e3ad9a96ac85b4f450085` keeps full-rate source rendering while running detector/tracker/panner only on analysis frames (`source_index % frame_stride == 0`), reuses `session.last_world_state.clone()` on render-only frames, and interpolates camera poses between sparse anchors. FFA main rollout commit `a729c5281ef1cb50046ce4ad721bdb1352ebf91e` enabled `--frame-stride 3` on the normal testing scripts. The earlier same-sample 30s benchmark (~2.737x faster stitch wall time) remains valid as a speed result; it is **not sufficient quality evidence**.

**Adapter/allocator fixes made while getting the real 180s stride-3 test to execute:** experiment branch `experiment/lookahead-ball-containment-01`. Bootstrap nested-quote bug fixed at `5c3d9309c8c605b090e3da0a8c17db311cf0c090`. The YOLO26 stride wrapper initially patched before the real base stitch command existed; the runner anchor was moved to the unique final base-execution boundary and validated before paid dispatch (fix lineage includes `21b3774`). These were harness/adapter defects, not Reco quality findings. The broadened allocator (`d3167ba9ca135c4a7bb53c24f77db703cec572f0`) proved GPU-type failover: a bad RTX 4090 NVDEC host was excluded and a later L4 passed preflight. RTX 5090 is now excluded from this experiment because run `31918562049` passed Vulkan/CUDA/NVDEC/basic ORT but the real Reco detector smoke failed `cudaErrorNoKernelImageForDevice` on the YOLO QuickGelu kernel. Run `31918951122` then demonstrated the remaining dominant failure mode: after rejecting a bad 4090, the other compatible types were simply out of capacity.

**Standardized 180s sample batch:** sample set `GX010197-seed1384188843`, same v4 camera settings + YOLO26m + lookahead 1.5 + alpha 0.08, with stride 3 as the only intended cadence change. `sample_01` completed after capacity retries and Johnson's visual verdict was roughly "few slight misses, 3-minute run isn't too bad." The remaining batch all completed workflow-successfully from experiment SHA `f75abe28eb98b85ae749ee11d52b4aec2f68a75c`: `sample_02` run `31938283243`, `sample_03` `31938286396`, `sample_04` `31938289343`, `sample_05` `31938292331`. **Green workflow status is execution evidence only; visual quality remains the acceptance gate.**

**Decisive visual finding:** Johnson reviewed `sample_02` and reported that the camera struggled to keep up with the ball for large portions and "even at the start the camera barely even moved." This is materially worse than the small misses in `sample_01` and is enough to reject the present stride-3 tuning pending an A/B control.

**Leading hypothesis — plausible, not yet proven by the control:** the accepted v4 limits/hysteresis are expressed per analysis update rather than in real time. Stride 3 drops meaningful panner updates from ~60Hz to ~20Hz but leaves values such as max yaw `0.75°/update`, confirmation `18` updates, and missing-ball hold `24` updates unchanged. In real-time terms that can turn roughly `45°/s` camera authority into `15°/s`, `18` updates from ~0.3s to ~0.9s, and `24` from ~0.4s to ~1.2s. That matches the observed "camera asleep / slowly catches up" failure shape, but do **not** call it proven until the same-sample stride-1 output is visually checked. The robust eventual fix should make limits/hysteresis time-aware/source-frame-aware rather than blindly multiplying every constant by 3.

**Clean same-sample control:** branch `experiment/sample02-v4-stride1-control`, head `6bc0857208b3d82a4f764a4f9658e42fdfc2057e`, run `31939820386`. It keeps the current b2fc Reco, broadened allocator, v4 stabilizer adaptation, YOLO26m, lookahead 1.5 and alpha 0.08, but does **not** inject `--frame-stride 3`. Workflow completed SUCCESS. **Visual comparison against stride-3 `sample_02` is still pending**; do not infer the product verdict from CI success alone.

**Processing-time variance — active investigation, do not conflate with pod setup:** for the four 180s batch runs, the outer `Upload + run sample-baseline test script` step lasted `6m17s` (`sample_02`), `18m26s` (`sample_03`), `13m05s` (`sample_04`), and `13m04s` (`sample_05`). This excludes allocator/bootstrap but is still only an outer step duration, **not yet the authoritative internal Reco processing time**. Next task is to pull each run's internal Reco/render timing, GPU model and FPS, normalize by the identical 180s source duration, and separate decode / YOLO / tracking+panner / stitch+render / encode where telemetry permits. Root-cause the ~3x spread; do not hand-wave it as "different scenes are harder" without log evidence.

**Immediate next actions:** (1) visually compare the completed stride-1 `sample_02` control with stride-3 `sample_02`; (2) finish the internal processing-time/GPU comparison for `sample_02`–`sample_05`; (3) if the control confirms cadence is the regression, make the v4 response/hysteresis time-aware so stride is a compute knob rather than changing the cameraman's real-time behaviour; (4) rerun the same multi-sample set before re-declaring stride 3 accepted.

## OEV zero-copy option 2 — shared CUDA/Vulkan buffers integrated; real stereo render correct; A/B measured (15 Aug 2026)'''

          s = s.replace(marker, section, 1)
          p.write_text(s)

          # Self-delete this one-shot workflow in the same commit.
          Path('.github/workflows/oev-state-sync-20260816.yml').unlink()
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Frame-stride 3 — OPEN REGRESSION' docs/ai-project-state.md
          grep -Fq '31939820386' docs/ai-project-state.md
          grep -Fq 'Processing-time variance — active investigation' docs/ai-project-state.md
          ! grep -Fq 'Frame-stride 3 — RESOLVED, in production (16 Aug)' docs/ai-project-state.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai-project-state.md .github/workflows/oev-state-sync-20260816.yml
          git diff --cached --check
          git commit -m 'docs: update OEV state after stride-3 multi-sample validation'
          git push origin HEAD:main
