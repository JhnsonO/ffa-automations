name: Append stride3 main state v2

on:
  push:
    branches: [feature/frame-stride-testing]
    paths:
      - .github/workflows/append-stride3-main-state-v2.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Append verified production state and push main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ai-project-state.md')
          t=p.read_text().rstrip()
          heading='## Full-rate frame stride 3 rollout — MERGED (15 Aug 2026)'
          if heading not in t:
              t += '''\n\n## Full-rate frame stride 3 rollout — MERGED (15 Aug 2026)\n\n- `JhnsonO/video-stitcher/main` advanced from `f27cbb6d0d65fcf9a11fb4d82d119ae214695318` to `b2fc622f4b07dfa0c43e3ad9a96ac85b4f450085`. This adds `reco stitch --frame-stride N` with default `1`; upstream/default Reco behavior therefore remains unchanged unless explicitly enabled.\n- Production stride semantics are full-rate output: every source frame is decoded/copied/rendered, while detector/tracker/panner state advances every Nth source frame. Camera poses are interpolated/smoothed between sparse AI anchors; 1.5s lookahead stays source-time correct. Shared-buffer CUDA/Vulkan zero-copy, NVDEC, CUDA detection, stereo sync, NV12/P010 and `--no-zero-copy` fallback were not changed.\n- Hardware evidence on RTX 4090 / EU-RO-1 / YOLO26m / `sample_01` 30s: stride 1 rendered 1,784 frames in ~183.535s; stride 3 rendered the same 1,784 frames at 60000/1001 cadence in ~67.064s. That is ~2.737x faster / ~63.46% lower stitch wall time and approximate compute cost.\n- FFA main commit `a729c5281ef1cb50046ce4ad721bdb1352ebf91e` pins the normal RunPod follow-cam, standard sample baseline, YOLO26 A/B and volume-populate build gate to Reco `b2fc622...`; the three normal follow-cam/sample remote scripts explicitly pass `--frame-stride 3`. Low-level diagnostics are not globally forced to stride 3.\n- Quality choice remains stride 3 rather than stride 4: the prior same-sample matrix showed materially safer quality tails at stride 3. One retained full-rate stride-3 video is still desirable for final visual evidence when RunPod capacity is available; the first full-rate hardware run completed both renders but its harness failed afterward and did not retain the video.\n- PR `JhnsonO/video-stitcher#5` is shown by GitHub as merged because the fork's `main` ref was fast-forwarded directly to its head commit. No CLA bot signature comment was posted.\n'''
          p.write_text(t.rstrip()+'\n')
          PY
          git diff --check
          if git diff --quiet; then
            echo 'State already current.'
            exit 0
          fi
          git config user.name 'JhnsonO'
          git config user.email '102224847+JhnsonO@users.noreply.github.com'
          git add docs/ai-project-state.md
          git commit -m 'docs: record stride 3 main rollout'
          git push origin HEAD:main
