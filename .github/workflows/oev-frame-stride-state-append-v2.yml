name: OEV Frame Stride State Append V2

on:
  push:
    branches:
      - feature/frame-stride-testing
    paths:
      - .github/workflows/oev-frame-stride-state-append-v2.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/frame-stride-testing
          fetch-depth: 0
      - name: Append verified state
        env:
          STATE_B64: ""
        run: |
          python3 - <<'PY'
          import base64, os
          path = 'docs/ai-project-state.md'
          marker = 'FRAME-STRIDE-VERIFIED-2026-08-15'
          text = open(path, encoding='utf-8').read()
          if marker not in text:
              block = base64.b64decode(os.environ['STATE_B64']).decode('utf-8')
              with open(path, 'a', encoding='utf-8') as f:
                  f.write(block)
          PY
          if git diff --quiet -- docs/ai-project-state.md; then
            echo 'State already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai-project-state.md
          git commit -m 'docs: record verified frame-stride benchmark [skip ci]'
          git push origin HEAD:feature/frame-stride-testing
