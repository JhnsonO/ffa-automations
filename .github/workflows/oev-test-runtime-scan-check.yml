name: OEV Test Runtime — Standalone Secrets-in-Layers Check (fast iteration, no rebuild)

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Full image ref to scan (e.g. ghcr.io/jhnsono/oev-test-runtime:v1-reco-53fe10f5)'
        required: true
        default: 'ghcr.io/jhnsono/oev-test-runtime:v1-reco-53fe10f5'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  scan-only:
    name: Scan an already-published image (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane and gitleaks (pinned, checksum-verified)
        env:
          CRANE_VERSION: "0.21.7"
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          cd /tmp

          curl -sSL --fail --retry 5 --retry-delay 2 -O "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          curl -sSL --fail --retry 5 --retry-delay 2 -O "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf go-containerregistry_Linux_x86_64.tar.gz crane
          sudo mv crane /usr/local/bin/crane

          curl -sSL --fail --retry 5 --retry-delay 2 -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail --retry 5 --retry-delay 2 -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

          crane version
          gitleaks version

      - name: Gitleaks canary self-test
        run: |
          set +e
          echo 'aws_access_key_id = AKIAZZZZZZZZZZZZZZZZ' | gitleaks stdin --no-banner --redact --exit-code 2
          CANARY_EXIT=$?
          set -e
          if [ "$CANARY_EXIT" -ne 2 ]; then
            echo "::error::Gitleaks canary self-test failed -- known fake AWS key was NOT detected (exit $CANARY_EXIT, expected 2). This gitleaks build may be silently broken; refusing to trust the layer scan."
            exit 1
          fi
          echo "Gitleaks canary self-test passed -- known fake secret correctly detected."

      - name: No-secrets-in-layers check
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          crane manifest --platform linux/amd64 "$IMAGE_REF" \
            | jq -r '.layers[] | "\(.digest) \(.mediaType)"' \
          | while read -r digest mediatype; do
            echo "Scanning layer $digest ($mediatype)"
            case "$mediatype" in
              *tar+gzip*)
                crane blob "$IMAGE_REF@$digest" | gunzip -c | tar -xO 2>/dev/null \
                  | gitleaks stdin --no-banner --redact --exit-code 2
                ;;
              *tar+zstd*)
                crane blob "$IMAGE_REF@$digest" | zstd -dc | tar -xO 2>/dev/null \
                  | gitleaks stdin --no-banner --redact --exit-code 2
                ;;
              *tar)
                crane blob "$IMAGE_REF@$digest" | tar -xO 2>/dev/null \
                  | gitleaks stdin --no-banner --redact --exit-code 2
                ;;
              *)
                echo "Unrecognized layer mediaType: $mediatype" >&2
                exit 1
                ;;
            esac
          done
          echo "No secrets found in any layer."
