name: Runner Failsafe

# Hourly check of the self-hosted runner (vultr-ffa). If it is offline,
# cancel stale queued GoPro Scanner runs (they can never start) and
# re-dispatch the scanner on ubuntu-latest so uploads keep flowing.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: runner-failsafe
  cancel-in-progress: false

jobs:
  check:
    name: Check vultr-ffa and fall back if offline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check runner and dispatch fallback
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request

          token = os.environ["GH_PAT"]
          repo = os.environ["REPO"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {"Authorization": f"token {token}", "Content-Type": "application/json"}

          def req(path, data=None, method=None):
              r = urllib.request.Request(api + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(r) as resp:
                  body = resp.read()
                  return json.loads(body) if body else {}

          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")

          # 1. Runner status
          runners = req("/actions/runners").get("runners", [])
          vultr = next((r for r in runners if r["name"] == "vultr-ffa"), None)
          status = vultr["status"] if vultr else "missing"
          print(f"vultr-ffa status: {status}")
          if status == "online":
              summary.write("vultr-ffa **online** — no action.\n")
              exit(0)

          # 2. Skip if a scanner run is already in progress (e.g. earlier fallback)
          in_prog = req("/actions/workflows/gopro-scanner.yml/runs?status=in_progress&per_page=1")
          if in_prog.get("total_count", 0) > 0:
              summary.write(f"vultr-ffa **{status}**, but a scanner run is already in progress — no action.\n")
              exit(0)

          # 3. Cancel stale queued scanner runs (self-hosted queue can never drain)
          queued = req("/actions/workflows/gopro-scanner.yml/runs?status=queued&per_page=30")
          cancelled = 0
          for run in queued.get("workflow_runs", []):
              try:
                  req(f"/actions/runs/{run['id']}/cancel", data=b"", method="POST")
                  cancelled += 1
              except Exception as e:
                  print(f"cancel {run['id']}: {e}")

          # 4. Dispatch scanner on ubuntu-latest
          payload = json.dumps({
              "ref": "main",
              "inputs": {"runner": "ubuntu-latest", "days": "2"}
          }).encode()
          req("/actions/workflows/gopro-scanner.yml/dispatches", data=payload, method="POST")
          print(f"Fallback dispatched (cancelled {cancelled} stale queued runs)")
          summary.write(
              f"vultr-ffa **{status}** — cancelled {cancelled} stale queued scanner run(s), "
              f"dispatched scanner on **ubuntu-latest**.\n"
          )
          PY
