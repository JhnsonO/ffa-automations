name: OEV Dormant Object Memory v2 Dispatch Once

on:
  push:
    branches:
      - test/oev-dormant-object-memory-02
    paths:
      - .github/workflows/oev-ball-containment-dispatch-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact containment-v2 baseline plus persistent dormant-object memory
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY' >/tmp/payload.json
          import json
          print(json.dumps({
              "ref": "test/oev-dormant-object-memory-02",
              "inputs": {
                  "datacenter": "EU-RO-1",
                  "sample_set_id": "GX010197-seed1384188843",
                  "sample_id": "sample_02",
                  "duration_s": "180",
                  "model_variant": "yolo26m",
                  "lookahead": "1.5",
                  "cluster_alpha_override": "0.08, \"ball_weight\": 0.70, \"dead_zone_rad\": 0.06, \"velocity_alpha\": 0.08, \"max_velocity_rad_per_sec\": 0.31, \"fov_tight\": 38.0, \"fov_default\": 44.0, \"fov_wide\": 58.0, \"ball_containment_enabled\": true, \"ball_containment_enter_fraction\": 0.80, \"ball_containment_exit_fraction\": 0.45"
              }
          }))
          PY
          echo 'Dispatching exact good containment-v2 setup plus passive persistent dormant-object memory.'
          echo 'No jump guard, no forced switch, no reacquisition delay. Dormant identities persist through misses and release only on observed motion.'
          cat /tmp/payload.json
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/oev-runpod-sample-baseline.yml/dispatches" \
            --data-binary @/tmp/payload.json
