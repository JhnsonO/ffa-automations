name: EXP7 — record verified state

on:
  push:
    branches:
      - diag/zc-exp7-real-fixture
    paths:
      - '.github/workflows/exp7-record-state.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Prepend verified EXP7 result
        env:
          EXP7_ENTRY_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('docs/ai-project-state.md')
          s = p.read_text()
          entry = base64.b64decode(os.environ['EXP7_ENTRY_B64']).decode()
          marker = '## OEV zero-copy NV12 corruption — EXP7: generic CUDA↔Vulkan OPAQUE_FD sharing PASSES; failure is image-specific'
          if marker not in s:
              p.write_text(entry + s)
          PY
          git diff --check
          git diff -- docs/ai-project-state.md | head -180

      - name: Commit verified state to main
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/ai-project-state.md; then
            echo 'No state change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai-project-state.md
          git commit -m 'docs: record EXP7 image-specific zero-copy boundary'
          git push origin HEAD:main
