name: Append frame-stride final handoff

on:
  push:
    branches: [feature/frame-stride-testing]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Append verified final handoff to project state
        shell: bash
        run: |
          set -euo pipefail
          SECTION_B64=''
          export SECTION_B64
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('docs/ai-project-state.md')
          text = p.read_text().rstrip()
          heading = '## Frame-stride testing + production rollout — FINAL HANDOFF (16 Aug 2026)'
          if heading not in text:
              section = base64.b64decode(os.environ['SECTION_B64']).decode().rstrip()
              p.write_text(text + '\n\n' + section + '\n')
          PY
          git diff --check
          if git diff --quiet; then
            echo 'State already contains final frame-stride handoff.'
            exit 0
          fi
          git config user.name 'JhnsonO'
          git config user.email '102224847+JhnsonO@users.noreply.github.com'
          git add docs/ai-project-state.md
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'docs: finalize frame-stride rollout state'
          git push origin HEAD:main
