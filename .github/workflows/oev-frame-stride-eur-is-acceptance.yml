name: OEV — Production Stride Acceptance EUR-IS-1

on:
  push:
    branches: [feature/frame-stride-testing]
    paths:
      - .github/workflows/oev-frame-stride-eur-is-acceptance.yml

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATACENTER: EUR-IS-1
      SAMPLE_SET_ID: GX010197-seed1384188843
      SAMPLE_ID: sample_01
      DURATION_S: '30'
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v5

      - name: Generate ephemeral SSH key
        run: |
          pip install -q cryptography
          python3 - <<'PY'
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          import os
          key=Ed25519PrivateKey.generate()
          open('/tmp/runpod_key','wb').write(key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.OpenSSH,
              serialization.NoEncryption()))
          open('/tmp/runpod_key.pub','wb').write(
              key.public_key().public_bytes(
                  serialization.Encoding.OpenSSH,
                  serialization.PublicFormat.OpenSSH)+b' oev-stride-prod\n')
          os.chmod('/tmp/runpod_key',0o600)
          PY

      - name: Launch one healthy EUR-IS-1 pod
        id: launch
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          VOLUME_MAP_JSON: ${{ vars.OEV_NETWORK_VOLUME_MAP }}
        run: |
          python3 -u - <<'PY'
          import json,os,subprocess,sys,time,urllib.request,urllib.error
          api=os.environ['RUNPOD_API_KEY']; dc=os.environ['DATACENTER']; base='https://rest.runpod.io/v1'
          headers={'Authorization':f'Bearer {api}','Content-Type':'application/json','Accept':'application/json'}
          volumes=json.loads(os.environ['VOLUME_MAP_JSON']); volume=volumes.get(dc)
          if not volume: raise SystemExit(f'No volume mapped for {dc}: {volumes}')
          print(f'Pinned datacenter={dc} volume={volume}')
          pub=open('/tmp/runpod_key.pub').read().strip(); ids='/tmp/runpod_all_pod_ids.txt'; open(ids,'w').close()
          def req(method,url,data=None,timeout=30):
              body=json.dumps(data).encode() if data is not None else None
              r=urllib.request.Request(url,data=body,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:
                      raw=x.read(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'HTTP {e.code}: {e.read().decode(errors="replace")[:400]}') from e
          def delete(pid):
              try:req('DELETE',f'{base}/pods/{pid}',timeout=20)
              except Exception as e:print(f'delete warning {pid}: {e}')
          def ssh_ready(ip,port):
              for _ in range(24):
                  p=subprocess.run(['ssh','-i','/tmp/runpod_key','-p',str(port),'-o','StrictHostKeyChecking=no','-o','ConnectTimeout=8',f'root@{ip}','echo OK'],capture_output=True,text=True,timeout=15)
                  if 'OK' in p.stdout:return True
                  time.sleep(5)
              return False
          def preflight(ip,port):
              scp=['-i','/tmp/runpod_key','-P',str(port),'-o','StrictHostKeyChecking=no','-o','ServerAliveInterval=30','-o','ServerAliveCountMax=10']
              ssh=['-i','/tmp/runpod_key','-p',str(port),'-o','StrictHostKeyChecking=no','-o','ServerAliveInterval=30','-o','ServerAliveCountMax=10']
              subprocess.run(['scp',*scp,'runpod_gpu_preflight.sh',f'root@{ip}:/tmp/runpod_gpu_preflight.sh'],check=True,timeout=60)
              p=subprocess.run(['ssh',*ssh,f'root@{ip}','chmod +x /tmp/runpod_gpu_preflight.sh && stdbuf -oL -eL /tmp/runpod_gpu_preflight.sh'],capture_output=True,text=True,timeout=240)
              text=p.stdout+p.stderr
              return p.returncode==0 and 'PREFLIGHT_RESULT=PASS' in text.splitlines(),text
          winner=None; summaries=[]
          for attempt in range(1,4):
              pid=None
              body={
                'name':'oev-stride-prod-eur-is','imageName':'runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404',
                'gpuTypeIds':['NVIDIA GeForce RTX 4090','NVIDIA RTX A5000','NVIDIA GeForce RTX 3090','NVIDIA L4'],
                'gpuTypePriority':'custom','gpuCount':1,'cloudType':'SECURE','containerDiskInGb':120,
                'ports':['22/tcp'],'supportPublicIp':True,'allowedCudaVersions':['12.8'],
                'networkVolumeId':volume,'volumeMountPath':'/runpod-volume','dataCenterIds':[dc],
                'env':{'PUBLIC_KEY':pub,'SSH_PUBLIC_KEY':pub}}
              try:
                  pod=req('POST',f'{base}/pods',body); pid=pod['id']; open(ids,'a').write(pid+'\n')
                  print(f'attempt {attempt}: pod={pid}')
                  deadline=time.time()+300; ip=port=None; info={}
                  while time.time()<deadline:
                      info=req('GET',f'{base}/pods/{pid}?includeMachine=true'); ip=info.get('publicIp'); maps=info.get('portMappings') or {}; port=maps.get('22') or maps.get('22/tcp')
                      if ip and port:break
                      time.sleep(10)
                  if not ip or not port:raise RuntimeError('network timeout')
                  if not ssh_ready(ip,port):raise RuntimeError('SSH timeout')
                  ok,text=preflight(ip,port); open(f'preflight_attempt_{attempt}.txt','w').write(text)
                  machine=info.get('machine') or {}; gpu=info.get('gpu') or {}
                  gpu_name=gpu.get('displayName') or (machine.get('gpuType') or {}).get('displayName') or machine.get('gpuDisplayName') or machine.get('gpuTypeId') or 'unknown'
                  machine_id=info.get('machineId') or 'unknown'; actual_dc=machine.get('dataCenterId') or dc; cost=info.get('costPerHr')
                  summaries.append(f'attempt={attempt} pod={pid} gpu={gpu_name} machine={machine_id} dc={actual_dc} cost_per_hr={cost} preflight={"PASS" if ok else "FAIL"}')
                  if not ok:delete(pid); continue
                  open('preflight_output.txt','w').write(text); winner=(pid,ip,str(port),gpu_name,machine_id,actual_dc,'' if cost is None else str(cost)); break
              except Exception as e:
                  summaries.append(f'attempt={attempt} result=ERROR error={e}'); print(summaries[-1]);
                  if pid:delete(pid)
          open('pod_selection_summary.txt','w').write('\n'.join(summaries)+'\n')
          if not winner: print('::error::No healthy EUR-IS-1 pod after 3 attempts'); sys.exit(1)
          pid,ip,port,gpu,machine,actual_dc,cost=winner
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in [('pod_id',pid),('ip',ip),('port',port),('gpu_type',gpu),('machine_id',machine),('data_center_id',actual_dc),('cost_per_hr',cost)]:f.write(f'{k}={v}\n')
          print(f'healthy pod: {winner}')
          PY

      - name: Bootstrap validated environment
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes root@$IP"
          SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          $SCP runpod_bootstrap.sh runpod_gpu_preflight.sh root@$IP:/tmp/
          $SSH 'chmod +x /tmp/runpod_bootstrap.sh /tmp/runpod_gpu_preflight.sh && stdbuf -oL -eL /tmp/runpod_bootstrap.sh' | tee bootstrap_output.txt

      - name: Stage exact sample and YOLO26m from replicated volume
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes root@$IP"
          SAMPLE_DIR="/runpod-volume/oev-samples/$SAMPLE_SET_ID/$SAMPLE_ID"
          LEFT="$SAMPLE_DIR/${SAMPLE_ID}_left_${DURATION_S}s.mp4"
          RIGHT="$SAMPLE_DIR/${SAMPLE_ID}_right_${DURATION_S}s.mp4"
          MODEL='/runpod-volume/oev-runtime/models/yolo26m.onnx'
          $SSH "set -e; mkdir -p /tmp/oev_stride; test -s '$LEFT'; test -s '$RIGHT'; test -s '$MODEL'; cp '$LEFT' /tmp/oev_stride/left.mp4; cp '$RIGHT' /tmp/oev_stride/right.mp4; cp '$MODEL' /tmp/oev_stride/yolo26m.onnx; stat -c '%n %s bytes' /tmp/oev_stride/left.mp4 /tmp/oev_stride/right.mp4 /tmp/oev_stride/yolo26m.onnx"

      - name: Run exact b2fc622 production stride acceptance
        id: matrix
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
        run: |
          SSH="ssh -i /tmp/runpod_key -p $PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes root@$IP"
          SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes"
          $SCP oev_frame_stride_benchmark_remote.sh root@$IP:/tmp/oev_frame_stride_benchmark_remote.sh
          set +e
          $SSH "set -e; chmod +x /tmp/oev_frame_stride_benchmark_remote.sh; export LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:\${LD_LIBRARY_PATH:-}; export VK_DRIVER_FILES=/tmp/nvidia_egl_icd.json; export VK_ICD_FILENAMES=/tmp/nvidia_egl_icd.json; unset DISPLAY; stdbuf -oL -eL /tmp/oev_frame_stride_benchmark_remote.sh" | tee matrix_console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "remote_exit=$rc" >> "$GITHUB_OUTPUT"
          test "$rc" -eq 0

      - name: Pull production evidence
        if: always()
        env:
          IP: ${{ steps.launch.outputs.ip }}
          PORT: ${{ steps.launch.outputs.port }}
          GPU_TYPE: ${{ steps.launch.outputs.gpu_type }}
          MACHINE_ID: ${{ steps.launch.outputs.machine_id }}
          DATA_CENTER_ID: ${{ steps.launch.outputs.data_center_id }}
          COST_PER_HR: ${{ steps.launch.outputs.cost_per_hr }}
        run: |
          mkdir -p stride_prod_artifact
          cp preflight*.txt pod_selection_summary.txt bootstrap_output.txt matrix_console.log stride_prod_artifact/ 2>/dev/null || true
          cat > stride_prod_artifact/pod_metadata.txt <<META
          gpu_type=$GPU_TYPE
          machine_id=$MACHINE_ID
          data_center_id=$DATA_CENTER_ID
          cost_per_hr=$COST_PER_HR
          reco_sha=b2fc622f4b07dfa0c43e3ad9a96ac85b4f450085
          sample_set_id=$SAMPLE_SET_ID
          sample_id=$SAMPLE_ID
          duration_s=$DURATION_S
          META
          if [ -n "${IP:-}" ] && [ -n "${PORT:-}" ]; then
            SCP="scp -i /tmp/runpod_key -P $PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
            $SCP root@$IP:/tmp/oev_stride/source_metadata.txt stride_prod_artifact/ || true
            $SCP root@$IP:/tmp/oev_stride/calibrate.log stride_prod_artifact/ || true
            $SCP root@$IP:/tmp/oev_stride/match.json stride_prod_artifact/ || true
            $SCP -r root@$IP:/tmp/oev_stride/results stride_prod_artifact/ || true
          fi

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oev-frame-stride-production-eur-is-${{ github.run_id }}
          path: stride_prod_artifact/
          retention-days: 14

      - name: Terminate every RunPod pod created
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID: ${{ steps.launch.outputs.pod_id }}
        run: |
          python3 -u - <<'PY'
          import os,time,urllib.request,urllib.error
          ids=[]
          try: ids=[x.strip() for x in open('/tmp/runpod_all_pod_ids.txt') if x.strip()]
          except FileNotFoundError: pass
          one=os.environ.get('POD_ID','').strip()
          if one and one not in ids:ids.append(one)
          headers={'Authorization':f"Bearer {os.environ['RUNPOD_API_KEY']}"}; failed=[]
          for pid in dict.fromkeys(ids):
              ok=False; last=''
              for _ in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(f'https://rest.runpod.io/v1/pods/{pid}',method='DELETE',headers=headers),timeout=20) as r:
                          if r.status in (200,202,204):ok=True; break
                  except urllib.error.HTTPError as e:
                      if e.code==404:ok=True; break
                      last=f'HTTP {e.code}'
                  except Exception as e:last=repr(e)
                  time.sleep(5)
              print(f'cleanup pod={pid} confirmed={ok} last={last}')
              if not ok:failed.append(pid)
          if failed:raise SystemExit(f'Unconfirmed pod cleanup: {failed}')
          PY

      - name: Acceptance
        if: always()
        env:
          REMOTE_EXIT: ${{ steps.matrix.outputs.remote_exit }}
        run: |
          test "${REMOTE_EXIT:-1}" = 0 || { echo '::error::Production stride acceptance did not complete'; exit 1; }
          test -s stride_prod_artifact/results/production_results.json || { echo '::error::production_results.json missing'; exit 1; }
          python3 - <<'PY'
          import json
          d=json.load(open('stride_prod_artifact/results/production_results.json'))
          g=d['production_gates']
          assert all(g[k] is True for k in ['full_rate_render','same_duration','same_output_fps','sparse_analysis_cadence','full_rate_pose_presentation'])
          assert g['posthoc_retime_used'] is False
          print('Production stride 3 acceptance PASS')
          PY
