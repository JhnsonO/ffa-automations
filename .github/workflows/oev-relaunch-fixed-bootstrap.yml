name: OEV — one-shot fixed bootstrap relaunch

on:
  push:
    branches:
      - experiment/lookahead-ball-containment-01

permissions:
  actions: write
  contents: read

jobs:
  validate-and-dispatch:
    if: github.event.head_commit.message == 'launch-v4-stride3-eu-fixed-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate stride bootstrap syntax before spending on RunPod
        run: |
          set -euo pipefail
          bash -n runpod_bootstrap.sh
          python3 - <<'PY'
          from pathlib import Path
          s = Path('runpod_bootstrap.sh').read_text()
          marker = 'python3 - "$V4_SCRIPT" <<\'PY\'\n'
          start = s.index(marker) + len(marker)
          end = s.index('\nPY\n', start)
          compile(s[start:end], 'runpod_bootstrap_outer_adapter', 'exec')
          print('bootstrap shell syntax + outer Python adapter syntax: PASS')
          PY

      - name: Dispatch same 180s v4 stride-3 test on broadened EU allocator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload=$(cat <<JSON
          {
            "ref": "${REF}",
            "inputs": {
              "datacenter": "EU-RO-1",
              "sample_id": "sample_01",
              "duration_s": "180",
              "sample_set_id": "GX010197-seed1384188843",
              "model_variant": "yolo26m",
              "lookahead": "1.5",
              "cluster_alpha_override": "0.08"
            }
          }
          JSON
          )
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/oev-runpod-sample-baseline.yml/dispatches" \
            -d "$payload")
          cat /tmp/body.txt || true
          test "$code" = '204'
          echo 'Dispatched fixed-bootstrap EU stride-3 test.'
