name: OEV — Prepare shared-buffer rollout files (temporary)

on:
  push:
    branches:
      - rollout/shared-buffer-main
    paths:
      - '.github/workflows/_prepare-shared-buffer-rollout.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rollout/shared-buffer-main
      - name: Transform operational files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          old='53fe10f548d5767ad94ef66aeaedf2d8c7161f27'
          new='f27cbb6d0d65fcf9a11fb4d82d119ae214695318'
          pin_files=[
            Path('.github/workflows/oev-populate-volume.yml'),
            Path('.github/workflows/oev-runpod-followcam.yml'),
            Path('.github/workflows/oev-runpod-sample-baseline.yml'),
            Path('.github/workflows/oev-runpod-followcam-ab-yolo26.yml'),
            Path('runpod_sample_baseline_yolo26_remote.sh'),
          ]
          total=0
          for p in pin_files:
            s=p.read_text(); n=s.count(old)
            if n:
              p.write_text(s.replace(old,new)); total+=n
              print(f'{p}: pin replacements={n}')
          if total == 0: raise SystemExit('no old Reco pins found')

          scripts=[Path('runpod_followcam_remote.sh'),Path('runpod_sample_baseline_remote.sh'),Path('runpod_sample_baseline_yolo26_remote.sh')]
          new_header=(
            '# Linux shared-buffer GPU path is production-enabled as of 2026-08-15.\n'
            '# Reco main f27cbb6d replaces the broken direct shared-VkImage path with\n'
            '# CUDA-VMM shared VkBuffers -> Vulkan GPU buffer-to-texture copies.\n'
            '# Verified on real GoPro NV12 and real P010/10-bit fixtures; CUDA detection\n'
            '# remains GPU-resident. Do not re-add --no-zero-copy except as an explicit\n'
            '# fallback/diagnostic comparison.\n#\n')
          new_note=(
            '# Shared-buffer zero-copy is intentionally enabled here (no --no-zero-copy).\n'
            '# The merged path was hardware-verified on RTX 4090 and L4 without the old\n'
            '# green/corrupt direct-shared-VkImage failure.\n')
          for p in scripts:
            s=p.read_text()
            s,n1=re.subn(r'# --no-zero-copy IS PASSED HERE.*?(?=# Deliberately does NOT pass)',new_header,s,count=1,flags=re.S)
            s,n2=re.subn(r'# --no-zero-copy: see.*?(?=(?:STITCH_ARGS=|: "\$\{LOOKAHEAD))',new_note,s,count=1,flags=re.S)
            if n1 != 1 or n2 != 1: raise SystemExit(f'{p}: stale comment blocks n1={n1} n2={n2}')
            s=s.replace('=== stitch.log: reco stitch (field follow-cam, l-shape, --no-zero-copy interim) ===','=== stitch.log: reco stitch (field follow-cam, l-shape, shared-buffer GPU path) ===')
            out=[]; removed=0
            for line in s.splitlines(keepends=True):
              if line.strip()=='--no-zero-copy': removed+=1
              else: out.append(line)
            if removed != 1: raise SystemExit(f'{p}: functional flag count={removed}')
            p.write_text(''.join(out))
            print(f'{p}: enabled shared-buffer path')

          outdir=Path('/tmp/rollout-files')
          for p in [*pin_files,*scripts]:
            dest=outdir/p
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(p.read_bytes())
          PY
      - name: Upload transformed files
        uses: actions/upload-artifact@v4
        with:
          name: shared-buffer-rollout-files-${{ github.run_id }}
          path: /tmp/rollout-files/
          retention-days: 7
