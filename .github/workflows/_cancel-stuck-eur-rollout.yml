name: OEV — Stop stuck EUR rollout refresh (temporary)

on:
  push:
    branches:
      - rollout/shared-buffer-main
    paths:
      - '.github/workflows/_cancel-stuck-eur-rollout.yml'

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Cancel stuck GitHub run and sweep its EUR populate pod
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json, os, time, urllib.error, urllib.request

          repo=os.environ['GITHUB_REPOSITORY']
          gh_headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json',
          }
          target_run=31900688401
          cancel=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{target_run}/cancel',
              data=b'', method='POST', headers=gh_headers)
          try:
              with urllib.request.urlopen(cancel,timeout=30) as r:
                  print(f'GitHub run {target_run} cancel HTTP {r.status}')
          except urllib.error.HTTPError as e:
              if e.code not in (409,):
                  print(e.read().decode(errors='replace')); raise
              print(f'GitHub run {target_run} already non-cancellable (HTTP 409)')

          rp_headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY'],'Accept':'application/json'}
          time.sleep(3)
          req=urllib.request.Request('https://rest.runpod.io/v1/pods',headers=rp_headers)
          with urllib.request.urlopen(req,timeout=30) as r:
              payload=json.loads(r.read())
          pods=payload.get('pods') or payload.get('data') or payload if isinstance(payload,list) else []
          if not isinstance(pods,list):
              raise RuntimeError(f'unexpected pods response shape: {type(payload)}')
          matches=[]
          for p in pods:
              if p.get('name')!='oev-populate-volume':
                  continue
              if p.get('networkVolumeId')!='yssxw5c673':
                  continue
              matches.append(p.get('id'))
          print('EUR populate pods to sweep:', matches)
          for pid in matches:
              d=urllib.request.Request(f'https://rest.runpod.io/v1/pods/{pid}',method='DELETE',headers=rp_headers)
              try:
                  with urllib.request.urlopen(d,timeout=30) as r:
                      print(f'pod {pid} termination HTTP {r.status}')
              except urllib.error.HTTPError as e:
                  if e.code==404:
                      print(f'pod {pid} already absent')
                  else:
                      print(e.read().decode(errors='replace')); raise
          PY
