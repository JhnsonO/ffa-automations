name: Launch ball reacquisition control

on:
  push:
    branches: [experiment/ball-reacquisition-control-01]
    paths: [.launch-ball-reacquisition-control-final]

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sample baseline control
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/oev-runpod-sample-baseline.yml/dispatches \
            -d '{"ref":"experiment/ball-reacquisition-control-01","inputs":{"datacenter":"EUR-IS-1","sample_id":"sample_02","duration_s":"180","sample_set_id":"GX010197-seed1384188843","model_variant":"yolo26m","lookahead":"1.5","cluster_alpha_override":"0.08"}}'
